<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Astroneers Mission Control</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Same team palette as the live site: steel blue, ice blue, crimson, red, cream on deep navy. Layout: rail on desktop, bottom tabs on phone; each tab opens with the answer, detail sits below it. */
:root{
  --bg:#141a28; --card:#1d2535; --ink:#f4f1e4; --muted:#9aa3b5; --line:#2b3549; --chip:#262f42; --hover:#2f3a50; --solid:#3f7bb5; --body:#d6d6cf; --track:#2b3549;
  --blue:#5388b7; --ice:#63a6dd; --crimson:#a44d57; --rose:#ca5a63; --red:#ec443d; --cream:#eae6ca; --navy:#2c4f7d;
  --accA:#3f7bb5; --accB:#2c4f7d; --accC:#7a2f3a; --goodText:#9fcdf0; --badText:#ff8f88;
  --p1:#63a6dd; --p2:#ec443d; --p3:#eae6ca; --p4:#d8737c;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
  --r:26px; --pad:22px; --gap:18px;
  --font:"Nexa","Nexa Bold",Arial,Helvetica,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;min-height:100vh;
  background:radial-gradient(800px 500px at 10% 0%,rgba(83,136,183,.20),transparent 60%) fixed,radial-gradient(700px 500px at 100% 100%,rgba(164,77,87,.16),transparent 60%) fixed,var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:92px minmax(0,1fr);gap:22px;max-width:1440px;margin:0 auto;padding-block:20px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;align-items:center}
.rail .logo{width:68px;height:68px;margin:0 auto 12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.rail-inner{background:var(--card);border-radius:40px;box-shadow:var(--shadow);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rbtn{width:72px;padding:9px 2px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:700}
.rbtn span{font-size:20px;line-height:1}
.rbtn:hover{background:var(--chip);color:var(--ink)}
.rbtn[aria-current=page]{background:var(--solid);color:#fff}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.top img{display:none;width:52px;height:52px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.hello{min-width:0;flex:1}
.hello h1{margin:0;font-size:clamp(20px,2.4vw,30px);font-weight:700;letter-spacing:-.01em;text-wrap:balance;line-height:1.15}
.hello p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.round{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);text-decoration:none;flex:none;font-size:18px}
.round:hover{background:var(--hover)}
#refreshBtn.spin span{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stamp{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:0 0 18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ice);flex:none}
.dot.off{background:var(--cream)}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(29,37,53,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:5px max(4px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));overflow-x:auto;gap:2px;scrollbar-width:none}.mnav::-webkit-scrollbar{display:none}
.mnav a{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:9.5px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:14px;min-height:48px;justify-content:center}
.mnav a span{font-size:18px;line-height:1}
.mnav a[aria-current=page]{background:var(--solid);color:#fff}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--pad);min-width:0}
.card>.h:last-child{margin-bottom:0}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.h h2{margin:0;font-size:16px;font-weight:700}
.h h3{margin:0;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--body);white-space:nowrap}
.pill.i{background:rgba(99,166,221,.14);color:var(--goodText)}
.pill.o{background:rgba(234,230,202,.14);color:var(--cream)}
.pill.l{background:rgba(236,68,61,.18);color:var(--badText)}
.pill.w{background:rgba(99,166,221,.18);color:var(--goodText)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--chip);padding:8px 14px;border-radius:999px;font-size:12.5px;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed=true]{background:var(--solid);color:#fff}
.chip:hover:not([aria-pressed=true]){background:var(--hover)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{color:var(--muted);padding:6px 0}
.ph{margin:0 0 16px}.ph h2{margin:0;font-size:22px}.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.col2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.stat{background:var(--chip);border-radius:14px;padding:10px 12px;min-width:0}
.stat .k{font-size:10.5px;color:var(--muted);line-height:1.25}
.stat .v{font-size:17px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.stat .rk{font-size:10.5px;color:var(--muted);margin-top:2px}
.stat .rk b{color:var(--goodText)}
.stat .mb{height:4px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.stat .mb i{display:block;height:100%;background:var(--ice);border-radius:9px}

/* home hero */
.accent{background:linear-gradient(135deg,var(--accA) 0%,var(--accB) 45%,var(--accC) 100%);color:#fff;position:relative;overflow:hidden}
.accent::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(236,68,61,.35),transparent 70%);right:-60px;top:-80px;pointer-events:none}
.accent>*{position:relative;z-index:1}
.accent .eyebrow,.accent .small{color:rgba(255,255,255,.78)}
.hero-score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 16px}
.bigrec{font-size:clamp(40px,12vw,56px);font-weight:700;line-height:1;letter-spacing:-.02em}
.bigrec small{font-size:14px;font-weight:700;opacity:.8;margin-left:6px;letter-spacing:0}
.hero-meta{font-size:13px;line-height:1.5;padding-bottom:4px;color:rgba(255,255,255,.88)}
.games{display:flex;flex-direction:column;gap:8px}
.game{background:rgba(20,26,40,.30);border-radius:18px;overflow:hidden}
.card:not(.accent) .game{background:var(--chip)}
.gbtn{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto 14px;gap:12px;align-items:center;background:none;border:0;text-align:left;padding:12px 14px;min-height:56px;color:inherit}
.gbtn::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;opacity:.7;transform:rotate(45deg);transition:transform .2s;justify-self:end;margin-top:-3px}
.gbtn[aria-expanded=true]::after{transform:rotate(-135deg);margin-top:3px}
.rp{font-size:12px;font-weight:700;text-align:center;padding:6px 0;border-radius:10px}
.rp.w{background:#9fcdf0;color:#141a28}.rp.l{background:var(--red);color:#fff}.rp.o{background:var(--cream);color:#141a28}
.gname{min-width:0}.gname b{display:block;font-size:15px;overflow-wrap:anywhere}
.gname small{display:block;font-size:12px;opacity:.75}
.gscore{font-size:22px;font-weight:700}
.gmore{padding:2px 14px 14px;font-size:13px}
.gmore[hidden]{display:none}
.pl{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid rgba(255,255,255,.14)}
.card:not(.accent) .pl{border-top-color:var(--line)}
.pl span{opacity:.88;text-align:right}
.box{margin-top:16px}
.box h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{background:rgba(20,26,40,.30);border-radius:14px;padding:10px 12px;min-width:0}
.tile .k{font-size:11px;color:rgba(255,255,255,.75)}
.tile .v{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{margin:10px 0 0;font-size:12px;color:rgba(255,255,255,.7)}
.homegrid{display:flex;flex-direction:column;gap:var(--gap)}
.homegrid .col{display:contents}
#cRes{order:1}#cCoach{order:2}#cPlayers{order:3}#cSnap{order:4}#cEarlier{order:5}#cDeep{order:6}

/* coach */
.coachhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.coachpic{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--crimson));display:grid;place-items:center;flex:none;border:2px solid var(--cream);font-size:22px}
.coachhead b{display:block;font-size:16px}
.headline{font-size:17px;font-weight:700;line-height:1.3;margin:0 0 8px;text-wrap:balance}
.lede{margin:0 0 14px;color:var(--body);font-size:14px;line-height:1.55}
.prio{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;padding:0;list-style:none;counter-reset:p}
.prio li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;background:var(--chip);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4;font-weight:700;counter-increment:p}
.prio li::before{content:counter(p);width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--crimson));display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff}
.stars{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.stars li{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.4}
.stars i{font-style:normal;font-weight:700;color:var(--cream);flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cream);display:grid;place-items:center;font-size:11px}
.take{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--chip);font-size:13.5px;line-height:1.5;color:var(--body)}
.take b{color:var(--cream)}
.late{margin:0 0 12px;padding:9px 12px;border-radius:12px;background:rgba(234,230,202,.10);color:var(--cream);font-size:12.5px}
details>summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--chip);font-size:15px;line-height:1;flex:none}
details[open]>summary::before{content:"–"}
.prose{white-space:pre-wrap;font-size:13px;line-height:1.55;color:var(--body);margin:8px 0 0;max-height:60vh;overflow:auto}
.preps{display:flex;flex-direction:column;gap:8px}
.prep{background:var(--chip);border-radius:18px}
.pbtn{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 40px;gap:12px;align-items:start;background:none;border:0;text-align:left;padding:13px 14px;min-height:56px}
.pemo{font-size:24px;line-height:1.2;text-align:center}
.pname{font-weight:700;font-size:15px}
.pname small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.pquote{color:var(--body);font-size:13px;line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbtn[aria-expanded=true] .pquote{display:block;-webkit-line-clamp:unset}
.grade{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.grade.a,.grade.b{background:rgba(99,166,221,.18);color:var(--goodText)}
.grade.c{background:rgba(234,230,202,.16);color:var(--cream)}
.grade.d,.grade.f{background:rgba(236,68,61,.18);color:var(--badText)}
.grade.n{background:var(--card);color:var(--muted);font-size:12px}
.pmore{padding:0 14px 14px 60px;font-size:13px;line-height:1.5;color:var(--body)}
.pmore[hidden]{display:none}
.pmore p{margin:0 0 8px}.pmore b{color:var(--cream)}
.rc{background:var(--chip);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rc .rh{display:flex;gap:10px;align-items:center}
.rc p{margin:0;font-size:13px;line-height:1.5;color:var(--body)}
.rc .qt{color:var(--cream)}
.ins{display:grid;grid-template-columns:5px 1fr auto;gap:12px;background:var(--chip);border-radius:16px;padding:12px 14px;align-items:start}
.ins i{border-radius:9px;align-self:stretch}
.ins b{display:block;font-size:14px}
.ins .v{font-size:18px;font-weight:700}
.ins p{margin:6px 0 0;font-size:12.5px;color:var(--body);line-height:1.5}

/* snapshot + pips */
.snaprow{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{width:84px;height:84px;flex:none}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:26px;height:30px;border-radius:9px;font-size:11px;font-weight:700;display:grid;place-items:center}
.pip.w{background:rgba(99,166,221,.22);color:var(--goodText)}.pip.l{background:rgba(236,68,61,.2);color:var(--badText)}.pip.o{background:rgba(234,230,202,.18);color:var(--cream)}
.spark{width:100%;height:56px;display:block;margin-top:14px}
.sess{border-top:1px solid var(--line)}
.sess:first-of-type{border-top:0}
.sess summary{justify-content:flex-start}
.sess summary .pill{margin-left:auto}
.deep{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.deep a{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:16px;padding:12px 14px;text-decoration:none;font-weight:700;font-size:13.5px;min-height:48px}
.deep a:hover{background:var(--hover)}

/* charts */
.chartbox{position:relative}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.axt{fill:var(--muted);font-size:10.5px;font-family:Arial,sans-serif}
.gl{stroke:var(--line);stroke-width:1}
.guide{stroke:var(--muted);stroke-width:1;opacity:0}
.tip{position:absolute;top:4px;left:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;line-height:1.45}
.tip.on{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.radar{width:100%;max-width:380px;margin:0 auto;display:block}
.zmap{width:100%;max-width:420px;margin:0 auto;display:block}
.zmap text{font-family:Arial,sans-serif}

/* bars */
.brow{display:grid;grid-template-columns:minmax(78px,150px) minmax(0,1fr) 64px;gap:10px;align-items:center;padding:6px 0}
.brow .nm{font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
.brow .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.bfill{display:block;height:100%;border-radius:99px;background:var(--ice)}
.bmark{position:absolute;top:-3px;width:2px;height:16px;background:var(--cream);border-radius:2px}
.bval{text-align:right;font-weight:700;font-size:13px}
.cm{padding:12px 0;border-top:1px solid var(--line)}
.cm:first-of-type{border-top:0}
.cm .ml{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px;font-weight:700}
.cm .ml small{font-weight:400;color:var(--muted)}
.lead{color:var(--cream)}
.wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.win{background:var(--chip);border-radius:16px;padding:12px 14px}
.win b{display:block;font-size:28px;line-height:1.1}

/* tables */
.tscroll{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.best{color:var(--cream);font-weight:700}
.search{display:block}
.search input{width:100%;background:var(--chip);border:0;border-radius:999px;padding:11px 16px;min-height:44px}
.search input::placeholder{color:var(--muted)}

/* trophies */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.badge{display:flex;gap:12px;align-items:center;background:var(--chip);border-radius:18px;padding:12px}
.badge.locked{opacity:.6}
.medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:2.5px solid var(--line);flex:none;background:var(--card)}
.medal.gold{border-color:var(--cream)}.medal.silver{border-color:var(--ice)}.medal.bronze{border-color:var(--rose)}
.badge b{display:block;font-size:13.5px}
.badge small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.badge .bt{height:5px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.badge .bt i{display:block;height:100%;background:var(--ice)}
.honors{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.honor{background:linear-gradient(135deg,rgba(63,123,181,.35),rgba(122,47,58,.35));border-radius:18px;padding:14px;text-align:center}
.honor span{font-size:26px}
.honor b{display:block;font-size:24px;line-height:1.2}
.honor small{color:var(--body);font-size:12px}
.rec{background:var(--chip);border-radius:18px;padding:14px}
.rec .eyebrow{display:block;margin-bottom:4px}
.rec b{display:block;font-size:24px;line-height:1.15}
.rec small{display:block;color:var(--muted);margin-top:3px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pod{display:flex;flex-direction:column;gap:6px}
.pod .r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.pod .r i{font-style:normal;font-weight:700;color:var(--cream)}


/* lines + pair matrix */
.line .h h2{margin:0}
.lrate{width:64px;height:64px;border-radius:18px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.lrate b{font-size:26px;line-height:1}
.lrate small{font-size:10px;color:var(--muted)}
.lrate.top{background:linear-gradient(135deg,var(--accA),var(--accC));color:#fff}

(function(){

const BENCH=()=>(M&&M.gradingBenchmarks&&M.gradingBenchmarks.roles)||{};

function result(m){const base=n(m.us.result)%16384;const ot=base===5||base===6;const us=n(m.us.score),th=n(m.opp.score);
  const w=us>th||(us===th&&(base===1||base===5));const dnf=!!(m.dnf||n(m.us.dnfWin)||n(m.opp.dnfWin)||n(m.us.result)>=16384);
  return {w,ot,dnf,code:w?(ot?'OTW':'W'):(ot?'OTL':'L'),cls:w?'w':(ot?'o':'l')}}

  const g=k=>n(r[k]);

function sessionKey(m){return m.sessionNight||m.observedDate||(m.ts?etKey(new Date(m.ts*1000-4*3600e3)):'unknown')}

  const idx={};SESS=[];
  MS.forEach(g=>{let s=idx[g.key];if(!s){s=idx[g.key]={key:g.key,overnight:g.overnight,games:[]};SESS.push(s)}s.games.push(g)});
  SESS.sort((a,b)=>((a.key==='unknown')-(b.key==='unknown'))||(a.key<b.key?1:-1));

const recText=t=>`${t.w}–${t.l}${t.o?'–'+t.o:''}`;

/* ---------- metrics catalog (used by Players, Compare, Stats) ---------- */
const MET=(label,get,type,o)=>Object.assign({label,get:typeof get==='function'?get:(p=>n(p.raw[get])),type,lower:false},o||{});
const SKG=[
 ['Scoring',[MET('Goals','skgoals','n'),MET('Assists','skassists','n'),MET('Points','skpoints','n'),MET('Points / GP',p=>p.ppg,'r'),MET('Goals / GP',p=>p.gpg,'r'),MET('Assists / GP',p=>p.apg,'r'),MET('Plus / minus','skplusmin','n'),MET('Game-winning goals','skgwg','n'),MET('Hat tricks','skhattricks','n'),MET('Power-play goals','skppg','n'),MET('Short-handed goals','skshg','n')]],
 ['Shooting',[MET('Shots on goal','skshots','n'),MET('Shot attempts','skshotattempts','n'),MET('Shooting %','skshotpct','p'),MET('On-net %','skshotonnetpct','p'),MET('Shots / GP',p=>p.spg,'r'),MET('Deflections','skdeflections','n'),MET('Screen chances','skscrnchances','n'),MET('Breakaways','skbreakaways','n'),MET('Breakaway goals','skbrkgoals','n'),MET('Breakaway %','skbreakawaypct','p'),MET('Penalty shot %','skpenaltyshotpct','p')]],
 ['Playmaking and possession',[MET('Completed passes','skpasses','n'),MET('Pass attempts','skpassattempts','n'),MET('Pass %','skpasspct','p'),MET('Saucer passes','sksaucerpasses','n'),MET('Dekes made','skdekesmade','n'),MET('Deke success %',p=>p.dekePct,'p'),MET('Dekes / GP',p=>p.dekesPG,'r'),MET('Possession / GP',p=>p.poss,'sec')]],

 ['Defense and puck care',[MET('Hits','skhits','n'),MET('Hits / GP',p=>p.hpg,'r'),MET('Blocked shots','skbs','n'),MET('Blocks / GP',p=>p.bpg,'r'),MET('Takeaways','sktakeaways','n'),MET('Takeaways / GP',p=>p.tkpg,'r'),MET('Giveaways','skgiveaways','n',{lower:true}),MET('Giveaways / GP',p=>p.gvpg,'r',{lower:true}),MET('Takeaway : giveaway',p=>p.tkgv,'r'),MET('Interceptions','skinterceptions','n')]],
 ['Discipline',[MET('Penalty minutes','skpim','n',{lower:true}),MET('PIM / GP',p=>p.pimpg,'r',{lower:true}),MET('Penalties drawn','skpenaltiesdrawn','n'),MET('Offsides','skoffsides','n',{lower:true}),MET('Fights won','skfightswon','n')]],
 ['Reliability',[MET('Games completed','gamesCompleted','n'),MET('DNF %','playerDNF','p',{lower:true}),MET('Quits and disconnects','playerQuitDisc','n',{lower:true}),MET('Wins','wins','n'),MET('Win %','skwinpct','p')]]
];
const GLG=[
 ['Goaltending',[MET('Games in net','glgp','n'),MET('Wins','glwins','n'),MET('Losses','gllosses','n',{lower:true}),MET('Save %',p=>p.svp,'p'),MET('Saves','glsaves','n'),MET('Shots against','glshots','n'),MET('Goals against','glga','n',{lower:true}),MET('Goals against avg','glgaa','r',{lower:true}),MET('Shutouts','glso','n'),MET('Win %','glwinpct','p')]],
 ['Special saves',[MET('Breakaway saves','glbrksaves','n'),MET('Breakaway save %',p=>n(p.raw.glbrkshots)?n(p.raw.glbrksaves)/n(p.raw.glbrkshots)*100:0,'p'),MET('Penalty shot saves','glpensaves','n'),MET('Desperation saves','gldsaves','n'),MET('Poke checks','glpokechecks','n'),MET('Goalie DNF %','glDNF','p',{lower:true})]]
];
function fmtV(t,v){if(v==null||!Number.isFinite(v))return '–';if(t==='n')return f0(v);if(t==='r')return f2(v);if(t==='p')return f1(v)+'%';if(t==='sec'){const s=Math.round(v);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}return String(v)}
function rankOf(m,p,peers){if(peers.length<2)return null;const v=m.get(p);return 1+peers.filter(q=>m.lower?m.get(q)<v:m.get(q)>v).length}

/* ---------- chart helpers ---------- */
let CH={},chSeq=0;
function box(svg,xs,tips,vbw){const id='c'+(++chSeq);CH[id]={xs,tips,vbw};return `<div class="chartbox" data-c="${id}">${svg}<div class="tip"></div></div>`}
function ticks(lo,hi,cnt){cnt=cnt||4;const span=(hi-lo)||1,raw=span/cnt,e=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/e;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e,t=[];
  for(let v=Math.ceil(lo/step-1e-9)*step;v<=hi+1e-9;v+=step)t.push(Math.round(v*1000)/1000);return {t,step}}
function frame(lo,hi){const tk=ticks(lo,hi);const top=Math.ceil(hi/tk.step-1e-9)*tk.step;const bot=Math.floor(lo/tk.step+1e-9)*tk.step;return Object.assign(ticks(bot,top),{lo:bot,hi:top})}
function xlabels(labels,xs,H){const N=labels.length,st=Math.max(1,Math.ceil(N/8));return labels.map((l,i)=>(i%st===0||i===N-1)&&l?`<text class="axt" x="${xs[i].toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`:'').join('')}
function lineChart(o){
  const W=640,H=o.h||230,ml=38,mr=14,mt=12,mb=28,iw=W-ml-mr,ih=H-mt-mb;
  const all=o.series.flatMap(s=>s.vals.filter(v=>v!=null));

    if(N<=40)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${xs[i].toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4" fill="${se.color}"/>`});
  });

  const tips=o.labels.map((l,i)=>`<b>${esc(o.tipTitle?o.tipTitle(i):l)}</b>`+o.series.map(se=>se.vals[i]==null?'':`<br>${esc(se.name)}: ${esc(o.fmt?o.fmt(se.vals[i]):se.vals[i])}`).join(''));

function stackedBars(o){

  s+=`<line class="guide" x1="0" x2="0" y1="${mt}" y2="${mt+ih}"/>`;

/* ---------- coach report parser ---------- */
function parseReport(txt){
  const out={headline:'',intro:'',players:[],stars:[],starsQuote:'',next:'',kicker:''};
  const blocks=String(txt||'').replace(/\r/g,'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  const clean=s=>s.replace(/^[^\p{L}\p{N}“"]+/u,'').replace(/[“”"]/g,'').trim();
  const isQ=l=>/^🎙/u.test(l);
  blocks.forEach((b,i)=>{
    const ls=b.split('\n').map(s=>s.trim()).filter(Boolean);
    const m=ls[0].match(/^(.*?)\s*·\s*Night Grade\s+(\S+)\s*·\s*Astroneers Overall\s+(\d+)/u);
    if(m){
      const emo=(m[1].match(/^[^\p{L}\p{N}]+/u)||[''])[0].trim();
      const p={emoji:emo,name:m[1].replace(/^[^\p{L}\p{N}]+/u,'').trim(),grade:m[2],overall:m[3],body:[],next:'',quote:''};
      ls.slice(1).forEach(l=>{if(isQ(l))p.quote=clean(l);else if(/^Next skate:/i.test(l))p.next=l.replace(/^Next skate:\s*/i,'');else p.body.push(l)});
      p.body=p.body.join(' ');out.players.push(p);return}
    if(/THREE STARS/i.test(ls[0])){ls.slice(1).forEach(l=>{if(isQ(l))out.starsQuote=clean(l);else{const mm=l.match(/^\d\.\s*(.+)$/);if(mm)out.stars.push(mm[1])}});return}
    if(/THE NEXT SKATE/i.test(ls[0])){out.next=ls.slice(1).join(' ');return}
    if(i===0&&ls.length===1&&!/\|/.test(ls[0]))out.headline=ls[0];
    if(i===1&&/FINKLESTEIN REPORT/i.test(ls[0]))out.kicker=ls[0];
    if(i===2&&out.headline&&ls.length===1&&!/^[A-Z ]+$/.test(ls[0]))out.intro=ls[0];
  });
  if(!out.players.length){
    const m=String(txt||'').match(/COPYABLE GROUP SUMMARY[\s\S]*$/);
    if(m)m[0].split('\n').forEach(l=>{const mm=l.match(/^(.+?)\s—\s([A-F][+-]?|N\/A):\s(.+)$/);if(mm)out.players.push({emoji:'',name:mm[1],grade:mm[2],overall:'',body:'',next:'',quote:mm[3].replace(/^.+?\.\s/,'')})});
    if(!out.headline)out.headline='Morning coach report';
  }
  return out;
}

/* ---------- top 3 priorities ---------- */
function priorities(p){
  const items=[];const seen=new Set();
  const add=t=>{t=String(t||'').replace(/\s+/g,' ').trim().replace(/[.]$/,'');if(!t)return;const k=t.toLowerCase().slice(0,40);if(seen.has(k))return;seen.add(k);items.push(cap(t))};
  if(p.next){p.next.replace(/\.$/,'').split(/,\s+and\s+|,\s+|;\s+/).forEach(add)}
  if(items.length<3){const w=[];p.players.forEach(pl=>{if(pl.next)w.push(pl.next.split(/(?<=\.)\s+/)[0])});w.forEach(add)}
  if(items.length<3){
    const gvp=[...SK].sort((a,b)=>b.gvpg-a.gvpg)[0];
    if(gvp)add(`Cut the giveaways. ${gvp.nick} is at ${f1(gvp.gvpg)} a game`);
    add('Confirm the lineup before puck drop');
  }
  return items.slice(0,3);
}

   <div class="pips" aria-label="Results, oldest to newest">${ordered.map(g=>`<span class="pip ${g.res.cls}" title="${esc(g.opp)} ${g.us}–${g.th}">${g.res.code==='OTW'?'W':g.res.code==='OTL'?'OL':g.res.code}</span>`).join('')}</div>
   <div class="small muted" style="margin-top:6px">Oldest on the left, newest on the right</div>${spark(ordered.map(g=>g.us-g.th))}

  const deep=`<section class="card" id="cDeep"><div class="h"><h2>Dive deeper</h2><span class="small muted">Charts, every stat, player compare</span></div><div class="deep">${go.map(([e,l,h])=>`<a href="#${h}"><span aria-hidden="true">${e}</span>${l}</a>`).join('')}<a href="classic.html"><span aria-hidden="true">🗂️</span>Classic view</a></div><p class="small muted" style="margin:12px 0 0">Classic view is the previous dashboard, with ratings, lineup chemistry and career tabs.</p></section>`;
  return `<div class="homegrid"><div class="col">${hero}${snap}${earl}</div><div class="col">${coach}${cards}${deep}</div></div>`;
}

/* ---------- state ---------- */
S={tab:'home',sel:null,zmode:'shots',cmp:[],cgrp:'Overview',gfilter:'all',gq:'',sgrp:'Scoring',sq:'',pgrp:'Last games'};
const mtile=(m,p,peers)=>{const v=m.get(p),rk=rankOf(m,p,peers);
  return `<div class="stat"><div class="k">${esc(m.label)}</div><div class="v num">${fmtV(m.type,v)}</div>${rk?`<div class="rk">${rk===1?'<b>Best on team</b>':'#'+rk+' of '+peers.length}</div>`:''}</div>`};
const chipsOf=(attr,items,cur)=>`<div class="chips" role="group">${items.map(([k,l,c])=>`<button class="chip" data-${attr}="${esc(k)}" aria-pressed="${String(k)===String(cur)}">${c?`<span class="cdot" style="background:${c}"></span>`:''}${esc(l)}</button>`).join('')}</div>`;
const BENCHKEY={'Goals / GP':'goals','Assists / GP':'assists','Giveaways / GP':'giveaways','Takeaways / GP':'takeaways','Blocks / GP':'blocks'};

/* ---------- PLAYERS ---------- */
function playerZones(p,mode){
  const sh={},gl={};for(let k=1;k<=16;k++){sh[k]=p.raw['skShotsLocationOnIce'+k];gl[k]=p.raw['skGoalsLocationOnIce'+k]}
  const ns={},ng={};for(let k=1;k<=5;k++){ns[k]=p.raw['skShotsLocationOnNet'+k];ng[k]=p.raw['skGoalsLocationOnNet'+k]}
  const tot=Object.values(sh).reduce((a,b)=>a+n(b),0);
  const top=Object.keys(sh).map(Number).sort((a,b)=>n(sh[b])-n(sh[a]))[0];
  return `<div class="col2" style="align-items:center"><div>${zoneMap(sh,gl,mode)}</div><div>
    <div class="eyebrow" style="margin-bottom:8px">Where the puck goes on the net</div>${netMap(ns,ng)}
    <p class="small muted" style="margin:12px 0 0">${tot?`${f0(tot)} tracked shots. Favorite spot: <b style="color:var(--ink)">${ZNAME[top]}</b> (${f1(n(sh[top])/tot*100)}% of shots).`:''}</p></div></div>`;
}
function vPlayers(){
  if(!S.sel||!P.find(x=>x.key===S.sel))S.sel=(SK.slice().sort((a,b)=>b.pts-a.pts)[0]||P[0]).key;
  const p=P.find(x=>x.key===S.sel),L=LOG[p.key],peers=p.isG?GK:SK;
  const picker=chipsOf('psel',P.map(x=>[x.key,x.nick,x.color]),S.sel);
  const rec=`${n(p.raw.wins)}-${n(p.raw.losses)}${n(p.raw.otl)?'-'+n(p.raw.otl):''}`;
  const head=`<section class="card s4"><div class="h" style="margin-bottom:10px"><div style="display:flex;gap:12px;align-items:center;min-width:0"><span class="cdot" style="background:${p.color};width:14px;height:14px"></span><div style="min-width:0"><h2 style="font-size:20px">${esc(p.nick)}</h2><div class="small muted">${esc(p.role)} · ${esc(p.raw.clientPlatform||'')} · ${p.style?esc(p.style)+' · ':''}${f0(p.gp+p.glgp)} games played · Record ${rec}</div></div></div>${p.isG?(p.glovr!=null?`<span class="pill i">Goalie rating ${p.glovr}</span>`:''):(p.ovr!=null?`<span class="pill i">3v3 overall ${p.ovr}</span>`:'')}</div>
   <div class="stats">${(p.isG
     ?[MET('Save %',q=>q.svp,'p'),MET('Saves','glsaves','n'),MET('Goals against avg','glgaa','r',{lower:true}),MET('Shutouts','glso','n'),MET('Wins','glwins','n'),MET('Games in net','glgp','n')]
     :[MET('Points','skpoints','n'),MET('Goals','skgoals','n'),MET('Assists','skassists','n'),MET('Points / GP',q=>q.ppg,'r'),MET('Shooting %','skshotpct','p'),MET('Plus / minus','skplusmin','n')]).map(m=>mtile(m,p,peers)).join('')}</div></section>`;
  /* radar */
  let radarCard='';
  if(!p.isG){
    const ax=[['Goals / GP',q=>q.gpg],['Assists / GP',q=>q.apg],['Shots / GP',q=>q.spg],['Hits / GP',q=>q.hpg],['Takeaways / GP',q=>q.tkpg],['Pass %',q=>q.pass]];
    const mx=ax.map(([,f])=>Math.max(...SK.map(f),1e-9));
    const avg=ax.map(([,f],i)=>SK.reduce((t,q)=>t+f(q),0)/SK.length/mx[i]);
    radarCard=`<section class="card s2"><div class="h"><h2>Skill shape</h2><span class="pill">vs team</span></div>${radar(ax.map(a=>a[0]),[{vals:avg,color:'#eae6ca',dash:true},{vals:ax.map(([,f],i)=>f(p)/mx[i]),color:p.color}])}${legend([{name:p.nick,color:p.color},{name:'Skater average',color:'#eae6ca'}])}<p class="small muted" style="margin:0">The outer ring is the best skater on the team in each skill.</p></section>`;
  }
  /* bench bars */
  const B=BENCH()[p.bench]||{};
  let benchCard='';
  if(!p.isG&&Object.keys(B).length){
    const items=[['Goals / GP',p.gpg,'goals'],['Assists / GP',p.apg,'assists'],['Takeaways / GP',p.tkpg,'takeaways'],['Blocks / GP',p.bpg,'blocks'],['Giveaways / GP',p.gvpg,'giveaways']].filter(i=>B[i[2]]!=null);
    const mx=Math.max(...items.map(i=>Math.max(i[1],B[i[2]])))*1.1;
    benchCard=`<section class="card s2"><div class="h"><h2>Versus an average ${p.bench==='defender'?'defenseman':p.bench}</h2><span class="pill">3v3 league</span></div>${bars(items.map(([l,v,k])=>({label:l,value:v,mark:B[k],text:f2(v)})),{max:mx})}<p class="small muted" style="margin:10px 0 0">The cream tick is the average 3v3 ${p.bench==='defender'?'defenseman':p.bench}. Fewer giveaways is better.</p></section>`;
  }else if(p.isG&&B.savePct!=null){
    benchCard=`<section class="card s2"><div class="h"><h2>Versus an average goalie</h2><span class="pill">3v3 league</span></div>${bars([{label:'Save %',value:p.svp,mark:B.savePct*100,text:f1(p.svp)+'%'}],{max:100})}<p class="small muted" style="margin:10px 0 0">The cream tick is the average human 3v3 goalie (${f1(B.savePct*100)}%).</p></section>`;
  }
  /* position split */
  const pos=Object.entries(p.posGP).filter(([,v])=>v>0);
  const PC={'Center':'#63a6dd','Left wing':'#ec443d','Right wing':'#d8737c','Defense':'#eae6ca','Goalie':'#5388b7'};
  const posCard=`<section class="card s2"><div class="h"><h2>Where they play</h2><span class="pill">${f0(pos.reduce((t,x)=>t+x[1],0))} games</span></div><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${donut(pos.map(([k,v])=>({label:k,value:v,color:PC[k]})),f0(p.gp+p.glgp),'games')}<div class="legend" style="flex-direction:column;gap:6px;margin:0">${pos.map(([k,v])=>`<span><i style="background:${PC[k]}"></i>${esc(k)} · ${f0(v)}</span>`).join('')}</div></div></section>`;
  /* last games */
  let trend='';
  const rows=p.isG?L.gl.filter(x=>n(x.r.glshots)>0):L.sk;
  if(rows.length){
    const labels=rows.map(x=>gdate(x.g)||('G'+(rows.indexOf(x)+1)));
    const tt=i=>`${rows[i].g.res.code} ${rows[i].g.us}–${rows[i].g.th} vs ${rows[i].g.opp}`;
    if(p.isG){
      trend=`<section class="card s4"><div class="h"><h2>Last ${rows.length} games in net</h2><span class="pill">Tracked games</span></div>
       ${legend([{name:'Saves',color:'#63a6dd'},{name:'Goals against',color:'#ec443d'}])}${stackedBars({labels,stacks:[{name:'Saves',vals:rows.map(x=>n(x.r.glsaves)),color:'#63a6dd'},{name:'Goals against',vals:rows.map(x=>n(x.r.glga)),color:'#ec443d'}],tipTitle:tt,extra:i=>'Save %: '+(n(rows[i].r.glshots)?f1(n(rows[i].r.glsaves)/n(rows[i].r.glshots)*100)+'%':'–'),aria:'Saves and goals against by game'})}</section>
       <section class="card s4"><div class="h"><h2>Save % by game</h2></div>${lineChart({labels,series:[{name:'Save %',color:'#eae6ca',area:true,vals:rows.map(x=>n(x.r.glshots)?n(x.r.glsaves)/n(x.r.glshots)*100:null)}],min:0,max:100,yfmt:v=>v+'%',fmt:v=>f1(v)+'%',tipTitle:tt,aria:'Save percentage by game'})}</section>`;
    }else{
      trend=`<section class="card s2"><div class="h"><h2>Points by game</h2><span class="pill">Last ${rows.length}</span></div>${legend([{name:'Goals',color:'#63a6dd'},{name:'Assists',color:'#eae6ca'}])}${stackedBars({labels,stacks:[{name:'Goals',vals:rows.map(x=>n(x.r.skgoals)),color:'#63a6dd'},{name:'Assists',vals:rows.map(x=>n(x.r.skassists)),color:'#eae6ca'}],tipTitle:tt,extra:i=>`SOG ${nz(rows[i].r.skshots)} · Hits ${nz(rows[i].r.skhits)}`,aria:'Goals and assists by game'})}</section>
       <section class="card s2"><div class="h"><h2>Puck care by game</h2><span class="pill">Last ${rows.length}</span></div>${legend([{name:'Takeaways',color:'#63a6dd'},{name:'Giveaways',color:'#ec443d'}])}${lineChart({labels,series:[{name:'Takeaways',color:'#63a6dd',vals:rows.map(x=>n(x.r.sktakeaways))},{name:'Giveaways',color:'#ec443d',vals:rows.map(x=>n(x.r.skgiveaways))}],min:0,tipTitle:tt,aria:'Takeaways and giveaways by game'})}</section>`;
    }
  }
  const zones=!p.isG&&n(p.raw.skshots)?`<section class="card s4"><div class="h"><h2>Shot map</h2>${chipsOf('zmode',[['shots','Shots'],['goals','Goals'],['pct','Shooting %']],S.zmode)}</div>${playerZones(p,S.zmode)}<p class="small muted" style="margin:10px 0 0">Darker zones have more. Shooting % only shows for zones with 8 or more shots. Tap or hover a zone for the exact numbers.</p></section>`:'';
  const groups=(p.isG?GLG.concat(SKG):SKG.concat(GLG.slice(0,0))).map(([name,ms],gi)=>`<details class="sess" ${gi===0?'open':''}><summary><span>${esc(name)}</span></summary><div class="stats" style="padding:2px 0 14px">${ms.map(m=>mtile(m,p,(p.isG&&GLG.some(g=>g[1].includes(m)))?GK:SK)).join('')}</div></details>`).join('');
  const all=`<section class="card s4"><div class="h"><h2>Every stat</h2><span class="small muted">Rank is among ${peers.length} ${p.isG?'goalie':'skaters'}${p.isG?'':' on the club'}</span></div>${groups}</section>`;
  return `<div class="ph"><h2>Players</h2><p>Pick a player to see how they play, how they compare, and every number EA tracks.</p></div><div class="toolbar">${picker}</div><div class="grid">${head}${radarCard}${benchCard}${posCard}${trend}${zones}${all}</div>`;
}

/* ---------- GAMES ---------- */
function vGames(){
  const all=MS,chrono=[...MS].reverse();
  const t=tally(all),pct=t.w/(t.n||1)*100;
  const lab=chrono.map((g,i)=>gdate(g)||('G'+(i+1)));
  const tt=i=>`${chrono[i].res.code} ${chrono[i].us}–${chrono[i].th} vs ${chrono[i].opp}`;
  const gd=chrono.map(g=>g.us-g.th);
  const roll=chrono.map((_,i)=>{const a=chrono.slice(Math.max(0,i-4),i+1);return a.filter(g=>g.res.w).length/a.length*100});
  const dnfs=all.filter(g=>g.res.dnf).length;
  const sess=SESS.filter(s=>/^\d{4}/.test(s.key)).slice().reverse();
  const q=S.gq.trim().toLowerCase();
  const fl=SESS.map(s=>({s,games:s.games.filter(g=>(S.gfilter==='all'||(S.gfilter==='W'&&g.res.w)||(S.gfilter==='L'&&!g.res.w)||(S.gfilter==='DNF'&&g.res.dnf))&&(!q||g.opp.toLowerCase().includes(q)))})).filter(x=>x.games.length);
  const shotShare=t.sf+t.sa?t.sf/(t.sf+t.sa)*100:0;
  const sum=`<section class="card s4"><div class="h"><h2>Tracked games</h2><span class="pill">${t.n} games</span></div><div class="snaprow" style="margin:0">${ring(pct,'var(--ice)','Win rate '+Math.round(pct)+'%')}<div class="stats" style="flex:1">
    <div class="stat"><div class="k">Record</div><div class="v num">${recText(t)}</div></div>
    <div class="stat"><div class="k">Goals for / against</div><div class="v num">${t.gf}–${t.ga}</div></div>
    <div class="stat"><div class="k">Per game</div><div class="v num">${f1(t.gf/(t.n||1))}–${f1(t.ga/(t.n||1))}</div></div>
    <div class="stat"><div class="k">Shot share</div><div class="v num">${f1(shotShare)}%</div></div>
    <div class="stat"><div class="k">Games with a DNF</div><div class="v num">${dnfs}</div></div></div></div></section>`;
  const c1=`<section class="card s2"><div class="h"><h2>Goal margin by game</h2><span class="pill">Oldest to newest</span></div>${marginBars({labels:lab,vals:gd,tips:chrono.map((g,i)=>`<b>${esc(tt(i))}</b><br>Margin ${sgn(gd[i])}${g.res.dnf?'<br>DNF':''}`),aria:'Goal margin by game'})}</section>`;
  const c2=`<section class="card s2"><div class="h"><h2>Goals for and against</h2></div>${legend([{name:'Goals for',color:'#63a6dd'},{name:'Goals against',color:'#ec443d'}])}${lineChart({labels:lab,series:[{name:'Goals for',color:'#63a6dd',vals:chrono.map(g=>g.us)},{name:'Goals against',color:'#ec443d',vals:chrono.map(g=>g.th)}],min:0,tipTitle:tt,aria:'Goals for and against by game'})}</section>`;
  const c3=`<section class="card s2"><div class="h"><h2>Shots for and against</h2></div>${legend([{name:'Shots for',color:'#63a6dd'},{name:'Shots against',color:'#d8737c'}])}${lineChart({labels:lab,series:[{name:'Shots for',color:'#63a6dd',vals:chrono.map(g=>g.sf)},{name:'Shots against',color:'#d8737c',vals:chrono.map(g=>g.sa)}],min:0,tipTitle:tt,aria:'Shots for and against by game'})}</section>`;
  const c4=`<section class="card s2"><div class="h"><h2>Win % over 5-game windows</h2></div>${lineChart({labels:lab,series:[{name:'Win %',color:'#eae6ca',area:true,vals:roll}],min:0,max:100,yfmt:v=>v+'%',fmt:v=>Math.round(v)+'%',tipTitle:tt,aria:'Rolling win percentage'})}</section>`;
  const c5=sess.length>1?`<section class="card s4"><div class="h"><h2>Results by night</h2><span class="pill">${sess.length} sessions</span></div>${legend([{name:'Wins',color:'#63a6dd'},{name:'Losses',color:'#ec443d'},{name:'OT losses',color:'#eae6ca'}])}${stackedBars({labels:sess.map(s=>shortDay(s.key)),stacks:[{name:'Wins',vals:sess.map(s=>tally(s.games).w),color:'#63a6dd'},{name:'Losses',vals:sess.map(s=>tally(s.games).l),color:'#ec443d'},{name:'OT losses',vals:sess.map(s=>tally(s.games).o),color:'#eae6ca'}],tipTitle:i=>fmtDay(sess[i].key,true),extra:i=>{const x=tally(sess[i].games);return `Goals ${x.gf}–${x.ga}`},aria:'Wins and losses by night'})}</section>`:'';
  const list=fl.length?fl.map(({s,games},si)=>{const l=slabel(s),tt2=tally(games);return `<section class="card s4"><div class="h"><h2>${esc(l.title)}</h2><span class="small muted">${esc(l.sub)}</span><span class="pill num">${recText(tt2)} · ${tt2.gf}–${tt2.ga}</span></div><div class="games">${games.map((g,i)=>gameRow(g,`gm${si}-${i}`)).join('')}</div></section>`}).join(''):'<section class="card s4"><div class="empty">No games match that filter.</div></section>';
  return `<div class="ph"><h2>Games</h2><p>Every tracked 3v3 game. Charts first, then the full list. Tap a game for the player lines.</p></div><div class="grid">${sum}${c1}${c2}${c3}${c4}${c5}
   <section class="card s4"><div class="toolbar" style="margin:0">${chipsOf('gf',[['all','All'],['W','Wins'],['L','Losses'],['DNF','DNF']],S.gfilter)}<label class="search" style="flex:1;min-width:180px;max-width:320px"><span style="position:absolute;left:-9999px">Search opponents</span><input id="gq" type="search" placeholder="Search opponents" value="${esc(S.gq)}" autocomplete="off"></label></div></section>${list}</div>`;
}

/* ---------- COMPARE ---------- */
function cmpMetrics(){return SKG.concat(GLG)}
function vCompare(){
  if(!S.cmp.length)S.cmp=SK.slice().sort((a,b)=>b.pts-a.pts).slice(0,3).map(p=>p.key);
  const sel=S.cmp.map(k=>P.find(p=>p.key===k)).filter(Boolean);
  const picker=`<div class="chips" role="group" aria-label="Players to compare">${P.map(p=>`<button class="chip" data-cp="${p.key}" aria-pressed="${S.cmp.includes(p.key)}"><span class="cdot" style="background:${p.color}"></span>${esc(p.nick)}</button>`).join('')}</div>`;
  const groups=cmpMetrics();
  const gnames=['Overview',...groups.map(g=>g[0])];

function ladderBadges(p){
  return LADD.filter(L=>p.isG?L.g:!L.g).map(L=>{const v=L.f(p);let tier=-1;L.steps.forEach((s,i)=>{if(v>=s)tier=i});
    const next=L.steps[tier+1],prev=tier>=0?L.steps[tier]:0;
    const t=tier>=0?TIERS[Math.min(tier,2)]:null;
    return {ic:L.ic,name:L.name,v,tier,label:tier>=0?(tier>=3?'Legend ':t[0]+' ')+L.steps[tier]:'Locked',cls:tier>=3?'gold':(t?t[1]:''),emoji:tier>=3?'👑':(t?t[2]:L.ic),next,pct:next?Math.min(100,(v-prev)/(next-prev)*100):100}});
}
function gameRecords(){
  const recs=[];
  const best=(label,f,opt)=>{let b=null;MS.forEach(g=>g.rows.forEach(r=>{if(opt&&opt.goalie!==undefined&&(r.position==='goalie'||r.glshots!=null)!==opt.goalie)return;const v=f(r);if(v==null||!Number.isFinite(v))return;if(!b||v>b.v)b={v,r,g}}));if(b&&b.v>0)recs.push({label,v:b.v,txt:opt&&opt.fmt?opt.fmt(b):String(b.v),who:dn(b.r.name),vs:b.g.opp,day:gdate(b.g)})};
  best('Most goals in a game',r=>r.skgoals!=null?n(r.skgoals):null,{goalie:false});
  best('Most assists in a game',r=>r.skassists!=null?n(r.skassists):null,{goalie:false});
  best('Most points in a game',r=>r.skgoals!=null?n(r.skgoals)+n(r.skassists):null,{goalie:false});
  best('Most shots in a game',r=>r.skshots!=null?n(r.skshots):null,{goalie:false});

}
function teamRecords(){
  const chrono=[...MS].reverse(),out=[];
  const bw=[...MS].filter(g=>g.res.w).sort((a,b)=>(b.us-b.th)-(a.us-a.th))[0];
  if(bw)out.push({label:'Biggest win',txt:`${bw.us}–${bw.th}`,sub:`vs ${bw.opp}${gdate(bw)?' · '+gdate(bw):''}`});
  const hs=[...MS].sort((a,b)=>b.us-a.us)[0];
  if(hs)out.push({label:'Most goals in a game',txt:String(hs.us),sub:`vs ${hs.opp}${gdate(hs)?' · '+gdate(hs):''}`});
  let best=0,cur=0;chrono.forEach(g=>{if(g.res.w){cur++;best=Math.max(best,cur)}else cur=0});
  out.push({label:'Longest win streak',txt:String(best),sub:'Across tracked games'});
  const sw=SESS.filter(s=>/^\d{4}/.test(s.key)&&s.games.length>=3).map(s=>({s,t:tally(s.games)})).sort((a,b)=>(b.t.w/b.t.n-a.t.w/a.t.n)||(b.t.gf-b.t.ga)-(a.t.gf-a.t.ga))[0];
  if(sw)out.push({label:'Best night',txt:recText(sw.t),sub:`${fmtDay(sw.s.key,true)} · goals ${sw.t.gf}–${sw.t.ga}`});
  const sh=[...MS].filter(g=>g.res.w).sort((a,b)=>b.sf-a.sf)[0];
  if(sh)out.push({label:'Most shots in a win',txt:String(sh.sf),sub:`vs ${sh.opp}`});
  const so=MS.filter(g=>g.th===0&&!g.res.dnf);if(so.length)out.push({label:'Shutouts (tracked)',txt:String(so.length),sub:'Opponent held to zero'});
  return out;
}

/* ---------- LINES (lineup chemistry, same formula as the classic dashboard) ---------- */
S.pairm='win';
const POSN={center:'C',leftWing:'LW',rightWing:'RW',defenseMen:'D',goalie:'G'};
const ROLES=['center','leftWing','rightWing','defenseMen','goalie'];
function trackedGames(){return MS.filter(g=>Number(g.m.gameType)===206&&g.m.confirmed3v3!==false&&(g.m.clubId==null||String(g.m.clubId)==='69789'))}
function lineups(){
  const names=new Set(P.map(p=>p.key)),groups=new Map(),games=trackedGames();let incomplete=0;
  for(const g of games){
    const lineup=g.rows.filter(x=>ROLES.includes(x.position)&&names.has(x.name));
    const goalies=lineup.filter(x=>x.position==='goalie'&&n(x.glshots)>0);
    const skaters=lineup.filter(x=>x.position!=='goalie'&&['skgoals','skassists','skshots','sktakeaways','skgiveaways','toiseconds'].some(k=>n(x[k])>0));
    if(skaters.length!==3||goalies.length!==1||new Set(lineup.map(x=>x.name)).size!==4||new Set(lineup.map(x=>x.position)).size!==4){incomplete++;continue}
    const players=[...skaters,...goalies].sort((a,b)=>ROLES.indexOf(a.position)-ROLES.indexOf(b.position));
    const key=JSON.stringify(players.map(({name,position})=>[name,position]));
    if(!groups.has(key))groups.set(key,{players,games:[]});
    groups.get(key).games.push(g);
  }
  const rows=[...groups.values()].map(({players,games})=>{
    const t=tally(games),cnt=t.n;
    const share=t.gf+t.ga?t.gf/(t.gf+t.ga):.5;
    const perf=.6*(t.w/cnt)+.4*share;
    const rating=Math.round(100*(cnt*perf+2)/(cnt+4));
    return {players,t,rating,share};
  }).sort((a,b)=>b.rating-a.rating||b.t.n-a.t.n);
  return {rows,incomplete,total:games.length};
}
function pairMatrix(mode){
  const games=trackedGames();
  const cell=(a,b)=>{const gs=games.filter(g=>g.rows.some(r=>r.name===a.key)&&g.rows.some(r=>r.name===b.key));if(!gs.length)return null;const t=tally(gs);return {t,n:gs.length,win:t.w/gs.length*100,gd:(t.gf-t.ga)/gs.length}};
  const head=`<div class="mx-h"></div>`+P.map(p=>`<div class="mx-h"><span class="cdot" style="background:${p.color}"></span>${esc(p.short)}</div>`).join('');
  let body='';
  P.forEach(a=>{body+=`<div class="mx-h" style="justify-content:flex-start"><span class="cdot" style="background:${a.color}"></span>${esc(a.short)}</div>`;
    P.forEach(b=>{const c=cell(a,b);
      if(!c){body+=`<div class="mx-c" style="background:var(--chip)"><b>–</b><small>no games</small></div>`;return}
      const v=mode==='win'?c.win-50:c.gd*10, a_=Math.min(1,Math.abs(v)/(mode==='win'?40:30));
      const col=v>=0?`rgba(99,166,221,${(.12+a_*.7).toFixed(2)})`:`rgba(236,68,61,${(.12+a_*.7).toFixed(2)})`;
      const main=mode==='win'?Math.round(c.win)+'%':sgn(Math.round(c.gd*10)/10);
      body+=`<div class="mx-c" title="${esc(a.nick)} and ${esc(b.nick)}: ${c.n} games, ${recText(c.t)}, goals ${c.t.gf}–${c.t.ga}" style="background:${col}${a===b?';outline:1px solid var(--muted)':''}"><b>${main}</b><small>${c.n} GP</small></div>`});
  });
  return `<div class="mx" style="grid-template-columns:70px repeat(${P.length},minmax(0,1fr))">${head}${body}</div>`;
}

  return `<div class="ph"><h2>Line chemistry</h2><p>How each full lineup of three skaters and a goalie has done together, and how every pair of players does when they share the ice.</p></div>
  <div class="grid">
   <section class="card s4"><div class="stats"><div class="stat"><div class="k">Full lineups found</div><div class="v num">${L.rows.length}</div></div><div class="stat"><div class="k">Tracked games</div><div class="v num">${L.total}</div></div><div class="stat"><div class="k">Games used</div><div class="v num">${L.total-L.incomplete}</div></div><div class="stat"><div class="k">Missing a full lineup</div><div class="v num">${L.incomplete}</div></div>${best?`<div class="stat"><div class="k">Best rating</div><div class="v num">${best.rating}</div></div>`:''}</div></section>
   ${rateBars}${cards||'<section class="card s4"><div class="empty">No complete roster lineup has been verified yet.</div></section>'}
   <section class="card s4"><div class="h"><h2>Pairs</h2>${chipsOf('pm',[['win','Win %'],['gd','Goal diff / game']],S.pairm)}</div>${pairMatrix(S.pairm)}<p class="small muted" style="margin:12px 0 0">Each box counts every tracked game where both players appear. The diagonal is a player's own games. Blue is better than even, red is worse. Tap or hover a box for the record.</p></section>
   <section class="card s4"><div class="h"><h2>How the rating works</h2></div><p class="small" style="margin:0;color:var(--body);line-height:1.55">A lineup is three skaters and one goalie who each played real minutes in the same game. Rating = 100 × (games × performance + 2) ÷ (games + 4). Performance is 60% win rate plus 40% goal share (goals for ÷ goals for and against). The +2 and +4 pull small samples toward 50. ${L.incomplete} of ${L.total} tracked games did not have a complete verified lineup and are left out.</p></section>
  </div>`;
}

/* ---------- RATINGS ---------- */
function reportGrades(){
  const out=[];
  ((R&&R.reports)||[]).forEach(r=>{
    const rows={};
    String(r.summary||'').split('\n').forEach(l=>{
      const m=l.match(/^[^\p{L}\p{N}]*(.+?)\s*(?:·|:)\s*Night Grade\s+(\S+)\s*·\s*(?:Astroneers\s+)?Overall\s+(\S+)/u);
      if(m){const p=P.find(x=>x.nick===m[1].trim());if(p)rows[p.key]={grade:m[2],overall:/^\d+$/.test(m[3])?Number(m[3]):null}}});
    if(Object.keys(rows).length)out.push({night:r.night,rows,record:r.record,games:r.games});
  });
  return out.sort((a,b)=>a.night<b.night?-1:1);
}
const GNUM={A:4,B:3,C:2,D:1,F:0};
const gnum=g=>GNUM[(g||'')[0]];
function vRatings(){
  const G=reportGrades(),ch=(M.chelhead)||{};
  const latest=G[G.length-1];
  const cards=P.map(p=>{
    const lr=latest&&latest.rows[p.key];
    const ovr=p.isG?(ch.goalieRatings&&ch.goalieRatings[p.key]?ch.goalieRatings[p.key].overall:null):(ch.ratings&&ch.ratings[p.key]?ch.ratings[p.key].overall:null);
    return `<section class="card s2"><div class="h" style="margin-bottom:10px"><div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="cdot" style="background:${p.color};width:12px;height:12px"></span><div style="min-width:0"><h2 style="font-size:16px">${esc(p.nick)}</h2><div class="small muted">${esc(p.role)}${p.style?' · '+esc(p.style):''}</div></div></div>${lr?`<span class="grade ${gcls(lr.grade)}" aria-label="Latest night grade ${esc(lr.grade)}">${esc(lr.grade)}</span>`:''}</div>
     <div class="stats"><div class="stat"><div class="k">ChelHead 3v3 ${p.isG?'goalie ':''}OVR</div><div class="v num">${ovr!=null?ovr:'–'}</div></div><div class="stat"><div class="k">Astroneers Overall</div><div class="v num">${lr&&lr.overall!=null?lr.overall:'–'}</div></div><div class="stat"><div class="k">Night grade${latest?' · '+esc(shortDay(latest.night)):''}</div><div class="v num">${lr?esc(lr.grade):'–'}</div></div></div></section>`}).join('');
  /* history */
  let hist='';
  if(G.length>=1){
    const lab=G.map(x=>shortDay(x.night));
    const gl=lineChart({labels:lab,series:P.map(p=>({name:p.nick,color:p.color,vals:G.map(x=>x.rows[p.key]?gnum(x.rows[p.key].grade):null)})),min:0,max:4,yfmt:v=>['F','D','C','B','A'][v]||'',fmt:v=>['F','D','C','B','A'][v]||'',tipTitle:i=>'Night of '+fmtDay(G[i].night,true),aria:'Night grade by night'});
    const ol=lineChart({labels:lab,series:P.map(p=>({name:p.nick,color:p.color,vals:G.map(x=>x.rows[p.key]&&x.rows[p.key].overall!=null?x.rows[p.key].overall:null)})),min:40,max:100,tipTitle:i=>'Night of '+fmtDay(G[i].night,true),aria:'Astroneers overall by night'});
    hist=`<section class="card s2"><div class="h"><h2>Night grades</h2><span class="pill">${G.length} reports</span></div>${legend(P.map(p=>({name:p.nick,color:p.color})))}${gl}</section>
     <section class="card s2"><div class="h"><h2>Astroneers Overall</h2><span class="pill">0 to 99</span></div>${legend(P.map(p=>({name:p.nick,color:p.color})))}${ol}</section>
     <section class="card s4"><div class="h"><h2>Grade history</h2></div><div class="tscroll"><table><thead><tr><th>Player</th>${G.map(x=>`<th>${esc(shortDay(x.night))}<br><span style="font-weight:400;text-transform:none;letter-spacing:0">${esc(x.record)}</span></th>`).join('')}</tr></thead><tbody>${P.map(p=>`<tr><td><span class="cdot" style="background:${p.color};display:inline-block;margin-right:8px"></span>${esc(p.nick)}</td>${G.map(x=>{const r=x.rows[p.key];return `<td>${r?`<span class="grade ${gcls(r.grade)}" style="display:inline-grid;width:32px;height:32px;font-size:14px">${esc(r.grade)}</span> <span class="small muted num">${r.overall!=null?r.overall:''}</span>`:'<span class="muted">–</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:10px 0 0">Each cell is the night grade and the Astroneers Overall for that night. A night with no verified games gets no grade.</p></section>`;
  }
  /* EA per game grades */
  const eaRows=[];
  MS.forEach(g=>g.rows.forEach(r=>{if(r.ratingOffense!=null&&r.position!=='goalie')eaRows.push({g,r})}));
  const eaCard=eaRows.length?`<section class="card s4"><div class="h"><h2>EA game grades</h2><span class="pill">${eaRows.length} player games</span></div>${legend([{name:'Offense',color:'#63a6dd'},{name:'Defense',color:'#eae6ca'},{name:'Teamplay',color:'#d8737c'}])}<div class="tscroll"><table><thead><tr><th>Game</th><th>Player</th><th>Offense</th><th>Defense</th><th>Teamplay</th></tr></thead><tbody>${eaRows.map(({g,r})=>`<tr><td>${esc(g.res.code)} ${g.us}–${g.th} vs ${esc(g.opp)}</td><td>${esc(dn(r.name))}</td><td class="num">${n(r.ratingOffense)}</td><td class="num">${n(r.ratingDefense)}</td><td class="num">${n(r.ratingTeamplay)}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:10px 0 0">These are the three grades EA records for a game. Only some games carry them.</p></section>`:'';
  /* method */
  const B=(M.gradingBenchmarks&&M.gradingBenchmarks.roles)||{};
  const bt=Object.keys(B).filter(k=>k!=='goalie').length?`<div class="tscroll"><table><thead><tr><th>Role</th><th>Goals</th><th>Assists</th><th>Takeaways</th><th>Giveaways</th><th>Blocks</th></tr></thead><tbody>${['center','wing','defender'].filter(k=>B[k]).map(k=>`<tr><td>${k==='defender'?'Defense':cap(k)}</td><td class="num">${f2(B[k].goals)}</td><td class="num">${f2(B[k].assists)}</td><td class="num">${f2(B[k].takeaways)}</td><td class="num">${f2(B[k].giveaways)}</td><td class="num">${f2(B[k].blocks)}</td></tr>`).join('')}</tbody></table></div>`:'';
  const gb=M.gradingBenchmarks||{};
  const method=`<section class="card s4"><div class="h"><h2>How grades work</h2><span class="pill o">Experimental</span></div><div class="col2"><div>
    <div class="eyebrow" style="margin-bottom:8px">Night grade</div>
    <p class="small" style="margin:0 0 10px;color:var(--body);line-height:1.55">A letter for one recorded night. It blends 80% how the night compares with an average 3v3 player in the same role and 20% how it compares with that player's own earlier games. Matching both gives a C. Goalies are graded on saves and shots against a human 3v3 goalie average of ${B.goalie&&B.goalie.savePct!=null?f1(B.goalie.savePct*100)+'%':'70.4%'}. Fewer than 5 active appearances keeps a grade provisional.</p>
    <div class="legend"><span><i style="background:#9fcdf0"></i>A 90+</span><span><i style="background:#63a6dd"></i>B 80 to 89</span><span><i style="background:#eae6ca"></i>C 70 to 79</span><span><i style="background:#ca5a63"></i>D 60 to 69</span><span><i style="background:#ec443d"></i>F under 60</span></div>
    <div class="eyebrow" style="margin:14px 0 8px">Overall</div>
    <p class="small" style="margin:0;color:var(--body);line-height:1.55">The Astroneers Overall is a separate 0 to 99 club-only rating built from each player's own tracked 3v3 history plus a small recent-form adjustment. It is not the night grade and not ChelHead's number.</p></div>
   <div><div class="eyebrow" style="margin-bottom:8px">League averages used (per game)</div>${bt||'<p class="empty">Benchmarks are not in the data file.</p>'}<p class="small muted" style="margin:10px 0 0">${gb.source?esc(gb.source)+'. ':''}${gb.checkedAt?'Checked '+esc(String(gb.checkedAt).slice(0,10))+'. ':''}These are model averages ChelHead shows, not exact population figures.</p></div></div></section>`;
  const note=`<section class="card s4"><div class="small muted" style="line-height:1.55">${esc(((M.reconciliation&&M.reconciliation.message)||''))} ${esc(((M.reconciliation&&M.reconciliation.details)||'').slice(0,320))}</div></section>`;
  return `<div class="ph"><h2>Ratings</h2><p>Night grades, overalls, and ChelHead's numbers in one place. Grades come from Coach Finklestein's reports.</p></div><div class="grid">${cards}${hist}${eaCard}${method}${(M.reconciliation&&M.reconciliation.message)?note:''}</div>`;
}

/* ---------- router + events ---------- */
const TABS=[['home','Home','🏠'],['coach','Coach','🎙️'],['players','Players','🧑‍🚀'],['games','Games','🏒'],['compare','Compare','⚔️'],['lineups','Lines','⚡'],['ratings','Ratings','📈'],['trophies','Trophies','🏆'],['stats','Stats','📊']];
const VIEWS={home:vHome,coach:vCoach,players:vPlayers,games:vGames,compare:vCompare,lineups:vLineups,ratings:vRatings,trophies:vTrophies,stats:vStats};
function navHtml(){
  $('#rail').innerHTML=TABS.map(([k,l,e])=>`<a class="rbtn" href="#${k}" data-tab="${k}"><span aria-hidden="true">${e}</span>${l}</a>`).join('');
  $('#mnav').innerHTML=TABS.map(([k,l,e])=>`<a href="#${k}" data-tab="${k}"><span aria-hidden="true">${e}</span>${l}</a>`).join('');
}
function curTab(){const h=(location.hash||'').slice(1);return VIEWS[h]?h:'home'}
function render(keepScroll){
  if(!D||!M)return;
  const y=window.scrollY;S.tab=curTab();CH={};chSeq=0;
  try{$('#view').innerHTML=VIEWS[S.tab]()}catch(err){console.error(err);$('#view').innerHTML='<div class="card"><div class="empty">Something went wrong drawing this page. ('+esc(err.message)+')</div></div>'}
  document.querySelectorAll('[data-tab]').forEach(a=>{if(a.dataset.tab===S.tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const t=new Date(D.fetchedAt);
  $('#stamp').textContent='Updated '+t.toLocaleString('en-US',{timeZone:TZ,month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET';
  $('#dot').classList.toggle('off',(Date.now()-t)>36*3600e3);
  const dv=(D.clubStats&&D.clubStats.currentDivision);
  $('#sub').textContent='NHL 27 · EASHL 3v3 · '+(dv!=null?'Division '+dv+' · ':'')+'Club 69789';
  document.title=(S.tab==='home'?'':cap(S.tab)+' · ')+'Astroneers Mission Control';
  window.scrollTo(0,keepScroll?y:0);
  const act=document.querySelector('#mnav a[aria-current=page]');if(act&&act.scrollIntoView)try{act.scrollIntoView({inline:'center',block:'nearest'})}catch(_){}
}
window.addEventListener('hashchange',()=>render(false));
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  const d=t.dataset||{};
  if(t.classList.contains('gbtn')||t.classList.contains('pbtn')){
    const open=t.getAttribute('aria-expanded')==='true';t.setAttribute('aria-expanded',String(!open));
    const el=document.getElementById(t.getAttribute('aria-controls'));if(el)el.hidden=open;return}
  if(d.pm){S.pairm=d.pm;render(true);return}
  if(d.psel){S.sel=d.psel;render(true);return}
  if(d.zmode){S.zmode=d.zmode;render(true);return}
  if(d.cp){const i=S.cmp.indexOf(d.cp);if(i>=0)S.cmp.splice(i,1);else S.cmp.push(d.cp);render(true);return}
  if(d.cg){S.cgrp=d.cg;render(true);return}
  if(d.gf){S.gfilter=d.gf;render(true);return}
  if(d.sg){S.sgrp=d.sg;render(true);return}
  if(d.rep!=null){repSel=+d.rep;render(true);return}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='gq'||id==='sq'){S[id]=e.target.value;const pos=e.target.selectionStart;render(true);const i=document.getElementById(id);if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}
});

/* ---------- load ---------- */
function load(){
  const q='?t='+Date.now();
  return Promise.all([
    fetch('data.json'+q,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data.json '+r.status);return r.json()}),
    fetch('matches.json'+q,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('matches.json '+r.status);return r.json()}),
    fetch('reports.json'+q,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
  ]).then(([d,m,r])=>{D=d;M=m;R=r;prep();render(true)});
}
navHtml();
const btn=$('#refreshBtn');
btn.addEventListener('click',()=>{btn.classList.add('spin');load().catch(()=>{}).finally(()=>setTimeout(()=>btn.classList.remove('spin'),500))});
load().catch(err=>{$('#view').innerHTML='<div class="card"><div class="empty">Could not load the club data. Check that data.json and matches.json sit next to this page. ('+esc(err.message)+')</div></div>'});
})();
</script>
