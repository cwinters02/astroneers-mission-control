<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astroneers Mission Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: matches Connor's Dashboard. Icon rail + card grid (4 / 2 / 1 columns), rounded 26px cards, navy gradient accent card. Bottom tab bar on phones. Dark only, by design. */
:root{
  /* Astroneers team colors, sampled from the club's in-game color screen: steel blue, ice blue, crimson, red, cream */
  --bg:#141a28; --card:#1d2535; --ink:#f4f1e4; --muted:#9aa3b5; --line:#2b3549; --chip:#262f42; --hover:#2f3a50; --solid:#3f7bb5; --body:#d6d6cf; --track:#2b3549;
  --icon:#8cc3ec; --accA:#3f7bb5; --accB:#2c4f7d; --accC:#7a2f3a;
  --blue:#5388b7; --ice:#63a6dd; --crimson:#a44d57; --rose:#ca5a63; --red:#ec443d; --cream:#eae6ca;
  --navy:#2c4f7d; --navy2:#1d2535; --bright:#3f7bb5; --light:#63a6dd; --green:#eae6ca;
  --good:#63a6dd; --goodText:#9fcdf0; --bad:#ec443d; --badText:#ff8f88; --warn:#eae6ca; --warnText:#eae6ca; --accentText:#9fcdf0;
  --p1:#63a6dd; --p2:#ec443d; --p3:#eae6ca; --p4:#d8737c;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
  --shadow-up:0 1px 0 rgba(255,255,255,.06) inset,0 22px 44px rgba(0,0,0,.55);
  --r:26px; --pad:22px; --gap:18px;
  --font:"Nexa","Nexa Bold",Arial,Helvetica,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(800px 500px at 10% 0%,rgba(83,136,183,.20),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(164,77,87,.16),transparent 60%)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:84px minmax(0,1fr);gap:22px;max-width:1440px;margin:0 auto;padding-block:22px 60px;padding-left:max(26px,env(safe-area-inset-left,0px));padding-right:max(26px,env(safe-area-inset-right,0px))}
/* rail */
.rail{position:sticky;top:calc(22px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;align-items:center}
.logo{width:48px;height:48px;display:grid;place-items:center;margin:2px auto 16px}
.rail-inner{background:var(--card);border-radius:40px;box-shadow:var(--shadow);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:calc(100vh - 130px)}
.rbtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);text-decoration:none;transition:background .2s,color .2s}
.rbtn:hover{background:var(--chip);color:var(--ink)}
.rbtn[aria-current=page]{background:var(--solid);color:#fff}
.rbtn .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);background:#2f3a50;color:#f4f1e4;font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.rbtn:hover .tip,.rbtn:focus-visible .tip{opacity:1}
.spacer{flex:1}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--light),var(--navy));color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.logo{width:68px;height:68px;margin:0 auto 14px}
.logo img{width:68px;height:68px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.toplogo{display:none;width:58px;height:58px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.avatar{background:linear-gradient(135deg,var(--rose),var(--crimson))!important;color:var(--cream)!important}
.accent .val{color:var(--cream)}
.coachpic{position:relative;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--crimson));display:grid;place-items:center;flex:none;border:2px solid var(--cream)}
.coachpic img{width:40px;height:40px}
.coachpic span{position:absolute;right:-6px;bottom:-4px;background:var(--cream);color:#141a28;font-size:9px;font-weight:700;border-radius:999px;padding:1px 5px}
.dials{display:flex;gap:10px;align-items:center}
.nodial{width:54px;font-size:9.5px;line-height:1.2;color:var(--muted);text-align:center}
.scols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media (max-width:520px){.scols{grid-template-columns:1fr}}
.scols h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.scols ul{margin:0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--body)}
.scols li::marker{color:var(--ice)} .scols ul.wk li::marker{color:var(--red)}
.take{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:13.5px;line-height:1.5;color:var(--body)}
.take b{color:var(--cream)}
#refreshBtn{color:var(--ink)}
#refreshBtn:disabled{cursor:default;opacity:.8}
#refreshBtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{margin:-8px 0 16px;padding:10px 16px;border-radius:14px;background:rgba(99,166,221,.14);color:var(--accentText);font-size:13px;font-weight:700}
/* top bar */
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.hello{min-width:0}
.hello h1{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.top .grow{flex:1}
.round{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--card);box-shadow:var(--shadow);text-decoration:none;transition:transform .2s;flex:none}
.round:hover{transform:translateY(-2px)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;background:var(--card);padding:12px 16px;border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(99,166,221,.6);animation:ping 2s infinite;flex:none}
.dot.off{background:var(--warn);animation:none}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(99,166,221,0)}100%{box-shadow:0 0 0 0 rgba(99,166,221,0)}}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--pad);min-width:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.card.lift:hover{transform:translateY(-5px);box-shadow:var(--shadow-up)}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.h h2{margin:0;font-size:16px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12.5px}
/* kpis */
.kpi{display:flex;align-items:center;gap:14px;padding:20px 22px}
.kpi .ic{width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--icon);flex:none}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.01em;white-space:nowrap}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .spark{margin-left:auto;flex:none}
.accent{background:linear-gradient(135deg,var(--accA) 0%,var(--accB) 45%,var(--accC) 100%);color:#fff;position:relative;overflow:hidden}
.accent::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(236,68,61,.35),transparent 70%);right:-60px;top:-80px;pointer-events:none}
.accent .lbl,.accent .sub{color:rgba(255,255,255,.78)}
.live-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;margin-left:6px}
/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--body);white-space:nowrap;border:0;text-decoration:none}
.pill.w{background:rgba(99,166,221,.18);color:var(--goodText)} .pill.l{background:rgba(236,68,61,.18);color:var(--badText)} .pill.o{background:rgba(234,230,202,.14);color:var(--cream)} .pill.i{background:rgba(99,166,221,.14);color:var(--accentText)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--chip);padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--solid);color:#fff}
.chip:focus-visible,.rbtn:focus-visible,.round:focus-visible,.mrow:focus-visible,th:focus-visible{outline:2px solid var(--light);outline-offset:2px}
/* stats tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:9px 11px;min-width:0}
.stat .k{font-size:10.5px;color:var(--muted);line-height:1.25}
.stat .v{font-size:15px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
/* roster tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{padding:10px 10px 14px;cursor:pointer;text-align:left;border:0;color:inherit;width:100%;display:block;text-decoration:none}
.tile{cursor:pointer}
.flip{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;margin-top:10px;gap:2px}
.flip button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer}
.flip button[aria-pressed=true]{background:var(--solid);color:#fff}
.flip button:focus-visible,.tile:focus-visible{outline:2px solid var(--light);outline-offset:2px}
.tile .art{height:118px;border-radius:18px;position:relative;overflow:hidden}
.tile .art .init{position:absolute;left:16px;bottom:12px;font-size:44px;font-weight:700;letter-spacing:-.02em;color:rgba(255,255,255,.92)}
.tile .art .pos{position:absolute;right:14px;top:12px}
.tile .body{padding:12px 8px 0}
.tile .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tile h3{margin:0;font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.tile .sub{font-size:12px;color:var(--muted);margin-top:3px}
.tile .stats{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.tile .stat{padding:8px 10px}
.tile .stat .v{font-size:12.5px}
.ring{flex:none}
/* signals / rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--solid);flex:none}
.row b{font-size:14px}
.row .grow{flex:1;min-width:0}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow{cursor:pointer;border-radius:12px;padding-inline:6px;margin-inline:-6px;background:none;border:0;border-bottom:1px solid var(--line);width:calc(100% + 12px);text-align:left;color:inherit}
.mrow:hover{background:var(--chip)}
.overview-coach ul{margin:0 0 12px;padding-left:19px;line-height:1.55}
.overview-coach li+li{margin-top:5px}
.overview-coach details{border-top:1px solid var(--line);padding-top:10px}
.overview-coach summary{cursor:pointer;font-weight:700;padding-block:4px}
.overview-coach details p{line-height:1.6;margin:10px 0 0}
.record-tie{border-bottom:1px solid var(--line);padding:10px 0}.record-tie summary{cursor:pointer}.record-tie .row{margin-top:5px}
/* hot zones */
.zones{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.rink-map{display:block;width:100%;height:auto;max-width:550px;margin:0 auto}
.goal{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.heatbar{display:inline-block;width:110px;height:10px;border-radius:5px;background:linear-gradient(90deg,#2c4f7a,#63a6dd,#eae6ca,#ec443d)}
.z{position:relative}
.z.is-hot{box-shadow:0 0 0 2px #ec443d inset,0 0 14px rgba(236,68,61,.45)}
.z .hot{position:absolute;top:-7px;left:50%;transform:translateX(-50%);z-index:2;font-style:normal;font-size:8px;font-weight:700;letter-spacing:.06em;background:#ec443d;color:#fff;border-radius:999px;padding:1px 5px;line-height:1.3}
.net{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"tl tr" "bl br" "fh fh";gap:4px;border:3px solid var(--red);border-bottom:0;border-radius:10px 10px 0 0;padding:6px;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.03) 6px 7px)}
.z{border-radius:8px;padding:6px 4px;text-align:center;min-height:44px;display:flex;flex-direction:column;justify-content:center;background:var(--chip);min-width:0}
.z b{font-size:14px;font-variant-numeric:tabular-nums}
.z span{font-size:9.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar-row .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px}
/* tables */
.tscroll{overflow-x:auto;border-radius:16px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--card);cursor:pointer;user-select:none}
th.sorted{color:var(--accentText)}
td{font-variant-numeric:tabular-nums}
td:first-child{font-weight:700}
tr:last-child td{border-bottom:0}
td.lead{color:var(--green);font-weight:700}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
/* compare */
.cmp-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.cmp-head{grid-template-columns:repeat(3,minmax(0,1fr))}
.cmp-head select{width:100%;background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:700}
.vs{font-weight:700;color:var(--muted)}
.cmp{display:grid;gap:12px}
.cmp-row .lbl{text-align:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.duel{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center;font-variant-numeric:tabular-nums;font-size:13.5px}
.duel .r{text-align:right}
.half{height:10px;background:var(--track);overflow:hidden;display:flex}
.half.l{justify-content:flex-end;border-radius:5px 0 0 5px}
.half.r{border-radius:0 5px 5px 0}
.win{font-weight:700}
/* match detail */
.mcard .score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin:4px 0 14px}
.mcard .team{min-width:0}
.mcard .team b{display:block;font-size:15px;overflow-wrap:anywhere}
.mcard .team.r{text-align:right}
.mcard .big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.tbar .split{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--track)}
.tbar .lab{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11.5px;margin-bottom:-4px}
.prose{max-width:68ch;font-size:14px;line-height:1.6;color:var(--body)}
.prose p{margin:0 0 10px}
.prose a{color:var(--accentText)}
.prose b{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:8px 16px;min-width:min(280px,100%)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.empty{color:var(--muted);font-size:13.5px;line-height:1.5}
.err{border:1px solid rgba(236,68,61,.45)}
/* mobile nav */
.mnav{display:none}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s3,.s4{grid-column:span 2}}
@media (max-width:860px){.zones{grid-template-columns:1fr}}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail{display:none}
  .toplogo{display:block;width:48px;height:48px}
  .hello{flex:1 1 200px}
  .hello h1{font-size:21px}
  .grid{grid-template-columns:minmax(0,1fr)}.s2,.s3,.s4{grid-column:span 1}
  :root{--pad:18px;--r:22px;--gap:14px}
  .kpi .val{font-size:23px}
  .mnav{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;background:rgba(29,37,53,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-up);padding:6px;justify-content:space-between}
  .mnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 1px;letter-spacing:-.01em;border-radius:999px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:700}
  .mnav a[aria-current=page]{background:var(--solid);color:#fff}
  .clock{padding:10px 13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Astroneers: navy, powder blue and maroon throughout */
:root{--bg:#101725;--card:#1b2639;--crimson:#873747;--rose:#bd697a;--light:#88b9db;--ice:#9cc8e5;--solid:#7c3445;--red:#db7d89;--badText:#f4b9c2;--muted:#b0b7c8;--line:#3b4358;--p2:#bc7285;--p4:#b5899b}
body{background:radial-gradient(ellipse at top right,#472330 0,transparent 45%),radial-gradient(ellipse at bottom left,#263f56 0,transparent 50%),var(--bg);background-attachment:fixed}
.card{border:1px solid rgba(156,200,229,.13);border-top:3px solid #42627e;background:linear-gradient(135deg,rgba(136,185,219,.08),transparent 65%),#1b2639}
.card:nth-of-type(4n+2){background:linear-gradient(135deg,rgba(135,55,71,.5),rgba(37,30,47,.8)),#1b2639;border-top-color:#bd697a}
.card:nth-of-type(4n+3){background:linear-gradient(135deg,rgba(136,185,219,.2),rgba(25,39,57,.9)),#1b2639;border-top-color:#9cc8e5}
.card.accent{background:linear-gradient(115deg,#315674 0%,#273d59 45%,#783346 100%);border-top-color:#9cc8e5}
.card .h h2{letter-spacing:.01em}.card .pill{border:1px solid rgba(156,200,229,.2)}
.rail-inner{background:linear-gradient(180deg,#24394e,#412535);border:1px solid #5b4b60}.rbtn[aria-current=page]{background:linear-gradient(135deg,#a05167,#6b2c3c);box-shadow:0 0 0 3px rgba(156,200,229,.15)}
.chip:hover,.round:hover{background:#563344;box-shadow:0 0 0 2px #88b9db}.chip[aria-pressed=true]{background:#7c3445!important;border-color:#d69aaa!important;color:#fff}

function spark(vals,color,w=78,h=32){if(vals.length<2)return '';const mx=Math.max(...vals.map(Math.abs),1);const st=w/(vals.length-1);
  const pts=vals.map((v,i)=>`${(i*st).toFixed(1)},${(h/2-(v/mx)*(h/2-4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="#2b3549" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${((vals.length-1)*st).toFixed(1)}" cy="${(h/2-(vals[vals.length-1]/mx)*(h/2-4)).toFixed(1)}" r="3" fill="${color}"/></svg>`}
function ring(pct,color,label){const p=Math.max(0,Math.min(100,pct));return `<svg class="ring" width="46" height="46" viewBox="0 0 46 46" aria-label="${label}"><circle cx="23" cy="23" r="19" fill="none" stroke="#2b3549" stroke-width="4"/><circle cx="23" cy="23" r="19" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="${p.toFixed(0)} 100" transform="rotate(-90 23 23)"/><text x="23" y="26.5" text-anchor="middle" font-size="10" font-weight="700" fill="#f4f1e4" font-family="Arial">${p.toFixed(0)}%</text></svg>`}

/* ---------- matches ---------- */
function result(m){const base=n(m.us.result)%16384;const ot=base===5||base===6;const us=n(m.us.score),th=n(m.opp.score);
  const w=us>th||(us===th&&(base===1||base===5));const dnf=!!(m.dnf||n(m.us.dnfWin)||n(m.opp.dnfWin)||n(m.us.result)>=16384);
  return {w,ot,dnf,code:w?(ot?'OTW':'W'):(ot?'OTL':'L'),cls:w?'w':(ot?'o':'l')}}
function mplayers(m){if(m._stats)return m._stats;return m.players.map(r=>Object.fromEntries(M.playerKeys.map((k,i)=>[k,r[i]])))}
function form(list){let w=0,l=0,o=0,gf=0,ga=0,sf=0,sa=0,toa=0,pc=0,pa=0;list.forEach(m=>{const r=result(m);if(r.w)w++;else if(r.ot)o++;else l++;gf+=n(m.us.score);ga+=n(m.opp.score);sf+=n(m.us.shots);sa+=n(m.opp.shots);toa+=n(m.us.toa);pc+=n(m.us.passc);pa+=n(m.us.passa)});
  const c=list.length||1;return {w,l,o,gf,ga,sf,sa,gfpg:gf/c,gapg:ga/c,sfpg:sf/c,sapg:sa/c,toa:toa/c,pass:div(pc,pa),n:list.length}}

function leagueComparison(p){
 const b=M?.gradingBenchmarks,goalie=p.fullTimeGoalie||p.primary==='goalie';
 const all=(leagueScope==='night'?lastSession():(M?.matches||[])).filter(m=>Number(m.gameType)===206);
 // Keep only this player's usable actual appearances in the selected role.
 const rows=all.flatMap(m=>mplayers(m).filter(x=>x.name===p.name&&((x.position==='goalie')===goalie)).map(x=>({m,x}))).filter(r=>goalie?n(r.x.glshots)>0:['skgoals','skassists','skshots','sktakeaways','skgiveaways'].some(k=>r.x[k]!=null&&n(r.x[k])>0));
 const role=r=>/defense/i.test(r.x.position)?'defender':r.x.position==='center'?'center':/Wing/.test(r.x.position)?'wing':null;
 const fmt=(v,percent)=>v==null?'Unavailable':percent?(100*v).toFixed(1)+'%':v.toFixed(2);
 const total=k=>rows.length&&rows.every(r=>r.x[k]!=null)?rows.reduce((s,r)=>s+n(r.x[k]),0):null;

 let metrics=[];
 if(goalie){const sv=total('glsaves'),sa=total('glshots');metrics=[{label:'Save percentage',actual:sv==null||!sa?null:sv/sa,average:b?.roles?.goalie?.savePct??null,percent:true,lower:false}];}
 else metrics=[['Goals','skgoals','goals',false],['Assists','skassists','assists',false],['Takeaways','sktakeaways','takeaways',false],['Giveaways','skgiveaways','giveaways',true],['Blocked shots','skbs','blocks',false]].map(([label,k,bk,lower])=>({label,actual:total(k)==null?null:total(k)/rows.length,average:ref(bk),percent:false,lower}));
 const available=metrics.filter(x=>x.actual!=null&&x.average>0),maxRatio=Math.max(1.5,...available.map(x=>x.actual/x.average));
 const difference=q=>{
   if(q.actual==null||q.average==null)return 'No complete sample';

   if(Number(amount)===0)return 'At role average';

   return `${amount} ${delta>0?'more':'fewer'} per game`;
 };
 const chart=metrics.map(q=>{const ratio=q.average>0&&q.actual!=null?q.actual/q.average:null;return `<div class="league-row"><div class="h"><b>${q.label}${q.lower?' ↓ lower is better':''}</b><span class="small muted">${difference(q)}</span></div><div class="league-bar"><span>You · ${fmt(q.actual,q.percent)}</span><div class="league-track"><i style="width:${ratio==null?0:100*ratio/maxRatio}%;background:var(--ice)"></i></div></div><div class="league-bar"><span>3v3 avg · ${fmt(q.average,q.percent)}</span><div class="league-track"><i style="width:${q.average>0?100/maxRatio:0}%;background:var(--crimson)"></i></div></div></div>`}).join('');
 return `<section class="card s4" aria-label="Player vs average EASHL 3v3"><div class="h"><h2>📊 ${esc(dn(p.name))} vs average EASHL 3v3</h2><div class="chips" role="group" aria-label="Comparison sample"><button class="chip" data-league-scope="night" aria-pressed="${leagueScope==='night'}">Last Night</button><button class="chip" data-league-scope="history" aria-pressed="${leagueScope==='history'}">Tracked 3v3 history</button></div></div><p class="small">${leagueScope==='night'?esc(sessionLabel(lastSession())):'All verified stored 3v3 games'} · ${rows.length} active ${goalie?'goalie':'skater'} appearances. ${goalie?'Human goalies only; skater games excluded.':'Per appearance; benchmark follows the actual position played.'}</p>${available.length?`<div class="league-chart" role="img" aria-label="Grouped bars comparing ${esc(dn(p.name))} with the average at the same 3v3 position. Exact values follow in a table.">${chart}</div>`:'<p>Not enough verified player or league data for this comparison.</p>'}<details style="margin-top:16px"><summary>Exact values & benchmark details</summary><div class="tscroll"><table><thead><tr><th>Metric</th><th>${esc(dn(p.name))}</th><th>3v3 role average</th><th>Direction</th></tr></thead><tbody>${metrics.map(q=>`<tr><td>${q.label}</td><td>${fmt(q.actual,q.percent)}</td><td>${fmt(q.average,q.percent)}</td><td>${q.lower?'Lower is better':'Higher is better'}</td></tr>`).join('')}</tbody></table></div><p class="small muted">ChelHead tracked-population reference averages, verified ${esc(b?.checkedAt?.slice(0,10)||'date unavailable')}. Rounded model references, not a census of every EASHL player. Missing fields are excluded, never estimated. DNF appearances are not time-scaled without verified ice time. Career totals may include other modes, so this graph uses stored confirmed 3v3 games only. ${goalie?'No verified league shot-volume/GAA baseline is available, so those comparisons are not drawn.':''}</p></details></section>`;
}

function overviewCoachCard(r){
 const rows=r.desk.rows;
 const goalie=r.desk.benchmark.role==='goalie';
 const total=k=>rows.length&&rows.every(({x})=>x[k]!=null)?rows.reduce((sum,{x})=>sum+n(x[k]),0):null;
 const stats=[`${rows.length} ${rows.length===1?'game':'games'}`];
 const add=(value,label)=>{if(value!=null)stats.push(`${value} ${label}`);};
 if(goalie){
   const saves=total('glsaves'),shots=total('glshots');
   if(saves!=null&&shots>0)stats.push(`${saves}/${shots} saves (${svp(saves,shots)})`);
   add(total('glga'),'GA');
 }else{
   const goals=total('skgoals'),assists=total('skassists');
   add(goals,'G');add(assists,'A');add(goals!=null&&assists!=null?goals+assists:null,'P');
   add(total('skshots'),'SOG');add(total('skgiveaways'),'GV');
 }
 const assignment=(r.assignment||'').replace(/^Next session:\s*/i,'');
 const bullets=[['What went well',r.highlight||'No verified appearance to assess.'],['Work on',r.focus||assignment],['Key stats',rows.length?stats.join(' · '):'No verified stats for this session.']];
 return `<section class="card s2 overview-coach"><div class="h"><h2>${esc(dn(r.name))}</h2><span class="pill">Night Grade ${letterGrade(r.main)} · Overall ${r.desk.overall??'N/A'}</span></div><ul>${bullets.map(([label,body])=>`<li><b>${label}</b> · ${esc(body)}</li>`).join('')}</ul><details><summary><span aria-hidden="true">📋</span> Full coach report</summary><p>${esc(r.take)}</p><p class="small"><b>Next session</b> · ${esc(assignment)}</p></details></section>`;
}

 const sum=k=>rows.length&&rows.every(r=>r.x[k]!=null)?rows.reduce((s,r)=>s+n(r.x[k]),0):null;
 const goals=sum('skgoals'),assists=sum('skassists'),saves=sum('glsaves'),shotsAgainst=sum('glshots'),goalsAgainst=sum('glga'),seconds=sum('toiseconds'),gp=rows.length;

const PLAYER_RECORDS=[
 ['🚀','Most goals','skgoals'],['🎁','Most assists','skassists'],['⭐','Most points','points'],
 ['🎯','Most shots on goal','skshots'],['🧲','Most takeaways','sktakeaways'],['🛡️','Most blocked shots','skbs'],

function playerRecords(player,showName=false){
 const names=new Set(player?[player.name]:P.map(p=>p.name));
 const rows=tracked3v3().flatMap(m=>mplayers(m).filter(x=>names.has(x.name)).map(x=>({m,x})));
 const records=PLAYER_RECORDS.map(([icon,label,key])=>{
   const goalie=key==='glsaves';
   const eligible=rows.filter(({x})=>(x.position==='goalie')===goalie&&(!player||(player.primary==='goalie'||player.fullTimeGoalie)===goalie));
   const value=x=>key==='points'?(x.skgoals==null||x.skassists==null?null:n(x.skgoals)+n(x.skassists)):x[key]==null?null:n(x[key]);
   const best=Math.max(0,...eligible.map(({x})=>value(x)??0));

function clubTableStat(p,rows,k,perGame=perGameT){
 const goalie=p.fullTimeGoalie||p.primary==='goalie';
 if(k==='overall')return {value:(goalie?p.glDesk:p.skDesk)?.overall};
 if(k==='skgp'||k==='glgp')return {value:rows.length};
 if(['wins','losses','glwins','gllosses'].includes(k))
   return {value:rows.filter(({m})=>result(m).w===(k==='wins'||k==='glwins')).length};
 const formulas={
   skpoints:[['skgoals','skassists'],([g,a],count)=> (g+a)/(perGame?count:1)],
   skpointspg:[['skgoals','skassists'],([g,a],count)=>(g+a)/count],
   skshotspg:[['skshots'],([shots],count)=>shots/count],
   dekespg:[['skdekes'],([dekes],count)=>dekes/count],
   dekePct:[['skdekesmade','skdekes'],([made,attempted])=>attempted>0?100*made/attempted:null],
   skshotpct:[['skgoals','skshots'],([a,b])=>b>0?100*a/b:null],
   skshotonnetpct:[['skshots','skshotattempts'],([a,b])=>b>0?100*a/b:null],
   skpasspct:[['skpasses','skpassattempts'],([a,b])=>b>0?100*a/b:null],
   skfop:[['skfow','skfol'],([a,b])=>a+b>0?100*a/(a+b):null],
   tkgv:[['sktakeaways','skgiveaways'],([a,b])=>b>0?a/b:null],
   toipg:[['toiseconds'],([seconds],count)=>seconds/count/60],
   gltoipg:[['toiseconds'],([seconds],count)=>seconds/count/60],
   svPct:[['glsaves','glshots'],([a,b])=>b>0?a/b:null],
   brkSv:[['glbrksaves','glbrkshots'],([a,b])=>b>0?a/b:null],
   penSv:[['glpensaves','glpenshots'],([a,b])=>b>0?a/b:null],
   glgaa:[['glga','toiseconds'],([a,b])=>b>0?3600*a/b:null]
 };
 const [keys,calculate]=formulas[k]||[[k],([value],count)=>value/(perGame?count:1)];
 const available=rows.filter(({x})=>keys.every(key=>x[key]!=null&&Number.isFinite(Number(x[key]))));
 const sums=keys.map(key=>available.reduce((total,{x})=>total+n(x[key]),0));
 const value=available.length&&(k!=='glgaa'||available.length===rows.length)?calculate(sums,available.length):null;
 return {value,coverage:available.length};
}

 h+=`<div class="card s4"><div class="h"><h2>Night vs Club</h2><span class="pill">${recent.length} active ${goalie?'goalie':'skater'} games</span></div><div class="tscroll"><table><thead><tr><th>Metric</th><th>Full night</th><th>Club Stats</th></tr></thead><tbody>${metrics.map(([label,a,b,digits])=>`<tr><td>${label}</td><td>${show(a,digits)}</td><td>${show(b,digits)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Both columns use saved confirmed Astroneers3v3 games. Career figures are available separately in Career stats. Grades use prior role-matched 3v3 history, excluding this night. Missing fields are omitted; active-game rates are not adjusted for game length.</p></div>`;
 h+=goalie?chart('Save percentage by game',active,x=>x.glsaves==null||!x.glshots?null:x.glsaves/x.glshots,'var(--ice)',true)+chart('Shots faced by game',active,x=>x.glshots??null,'var(--light)'):chart('Points by game',active,x=>x.skgoals==null||x.skassists==null?null:n(x.skgoals)+n(x.skassists),'var(--ice)')+chart('Giveaways by game',active,x=>x.skgiveaways??null,'var(--crimson)');
 return h;
}
function ratingTable(){const skaters=[...P].filter(p=>p.primary!=='goalie').sort((a,b)=>(b.cSk??-1)-(a.cSk??-1)),goalies=P.filter(p=>p.primary==='goalie');const rows=[...skaters,...goalies].map(p=>{const goalie=p.primary==='goalie',d=goalie?p.glDesk:p.skDesk;return `<tr><td>${esc(dn(p.name))}</td><td>${goalie?'Starting goalie':'Skater'}</td><td>${d.overall??'Unavailable'}</td><td>${letterGrade(d.form)}</td><td>${recordedRosterStats(p,goalie).gp}</td></tr>`}).join('');return `<div class="card s4"><div class="h"><h2>Player Ratings</h2><span class="pill">Overall and Night Grade are separate</span></div><div class="tscroll"><table><thead><tr><th>Player</th><th>Role</th><th>Overall</th><th>Night Grade · ${esc(matchNight(lastSession()[0]||{})||'Unavailable')}</th><th>Games</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small muted">Overall is a custom 0–99 rating covering saved confirmed Astroneers3v3 history and capped recent form. Night Grade is only a letter for the dated full session. Gumbo is evaluated only as starting goalie. Career/global ratings do not enter either calculation. These are experimental estimates, not official EA ratings.</p></div>`}

const letterGrade=r=>r==null?'N/A':r>=90?'A':r>=80?'B':r>=70?'C':r>=60?'D':'F';
function verifiedMatchCard(m,i){const r=result(m),open=openMatch===m.id,ps=mplayers(m);const show=x=>x==null?'–':esc(x);const cols=[['Pos','position'],['G','skgoals'],['A','skassists'],['+/-','skplusmin'],['SOG','skshots'],['Att','skshotattempts'],['Sh%','skshotpct'],['Hits','skhits'],['BS','skbs'],['TK','sktakeaways'],['GV','skgiveaways'],['INT','skinterceptions'],['Pass','passline'],['Pass%','skpasspct'],['Saucer','sksaucerpasses'],['Poss','skpossession'],['FOW','skfow'],['FOL','skfol'],['PIM','skpim'],['Drawn','skpenaltiesdrawn'],['PPG','skppg'],['SHG','skshg'],['GWG','skgwg'],['Defl','skdeflections'],['PK clr','skpkclearzone'],['SV','glsaves'],['SA','glshots'],['SV%','savepct'],['GA','glga'],['Brk SV','glbrksaves'],['Pen SV','glpensaves'],['D-saves','gldsaves'],['Poke','glpokechecks'],['Off','ratingOffense'],['Def','ratingDefense'],['Team','ratingTeamplay'],['Level','playerLevel'],['TOI','toiseconds'],['DNF','player_dnf']];
const val=(p,k)=>k==='passline'?(p.skpasses==null?'–':p.skpasses+'/'+p.skpassattempts):k==='toiseconds'?(p[k]==null?'–':secs(p[k])):k==='player_dnf'?(p[k]==null?'–':p[k]?'Yes':'No'):k==='position'?(POS[p.position]||p.position):k==='savepct'?(p.glshots?svp(p.glsaves,p.glshots):'–'):k==='skpossession'?(p[k]==null?'–':secs(p[k])):k.endsWith('pct')?(p[k]==null?'–':Number(p[k]).toFixed(1)+'%'):show(p[k]);
const bar=(label,a,b,fmt=x=>x)=>{const total=n(a)+n(b)||1;return `<div class="tbar"><div class="lab">${label}</div><span>${a==null?'–':fmt(a)}</span><div class="split"><div style="width:${a==null||b==null?50:100*n(a)/total}%;background:var(--light)"></div><div style="flex:1;background:var(--crimson)"></div></div><span style="text-align:right">${b==null?'–':fmt(b)}</span></div>`};let h=`<div class="card s2 mcard" style="animation-delay:${Math.min(.3,.02*i)}s"><div class="h"><span class="pill ${r.cls}">${r.code}${r.dnf?' (DNF)':''}</span><span class="small muted">${esc(competitionLabel(m))} · ${esc(m.observedDate||'Date unavailable')} (observed) · 3v3</span></div><div class="score"><div class="team"><b>Astroneers</b><span class="small muted">Div ${m.us.division}</span></div><div class="big">${m.us.score} – ${m.opp.score}</div><div class="team r"><b>${esc(m.opp.name)}</b><span class="small muted">Div ${m.opp.division??'—'}</span></div></div>${bar('Shots',m.us.shots,m.opp.shots)}${bar('Time on attack',m.us.toa,m.opp.toa,secs)}${bar('Passes completed',m.us.passc,m.opp.passc)}${bar('Pass attempts',m.us.passa,m.opp.passa)}<div style="margin-top:14px"><button class="chip" data-open="${esc(m.id)}" aria-expanded="${open}">${open?'Hide box score':'Show box score'}</button></div>`;
if(open)h+=`<div class="tscroll" style="margin-top:12px"><table><thead><tr><th>Player</th>${cols.map(c=>'<th>'+c[0]+'</th>').join('')}</tr></thead><tbody>${ps.map(p=>`<tr><td><span class="pdot" style="background:${col(p.name)}"></span>${esc(dn(p.name))}</td>${cols.map(c=>'<td>'+val(p,c[1])+'</td>').join('')}</tr>`).join('')}</tbody></table></div><div class="small muted" style="margin:14px 0 6px">${esc(m.opp.name)} players</div><div class="tscroll"><table><thead><tr><th>Player</th><th>Pos</th><th>G</th><th>A</th><th>SOG</th><th>SV</th><th>SA</th></tr></thead><tbody>${(m.oppPlayers||[]).map(o=>'<tr>'+o.map((v,j)=>'<td>'+show(j===1?(POS[v]||v):v)+'</td>').join('')+'</tr>').join('')}</tbody></table></div><div class="small muted" style="margin-top:10px">${m.crossCheck?'Cross-checked with Rink Rivals: result and displayed skater/goalie fields match. Giveaways and advanced fields remain ChelHead-only.':'Recorded from ChelHead; not cross-checked with another site.'} Dashes mean the field was not reported or collected. Player totals can differ from awarded DNF scores and AI contributions.</div>`;
return h+'</div>';}

/* ---------- router ---------- */
const VIEWS={overview:vOverview,coach:vCoach,players:vPlayers,matches:vMatches,stats:vStats,compare:vCompare,about:vAbout};
let cur='overview';
function render(keepScroll){
  const v=(location.hash||'#overview').slice(1); cur=VIEWS[v]?v:'overview';
  document.querySelectorAll('[data-v]').forEach(a=>{if(a.dataset.v===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const y=window.scrollY; $('#view').innerHTML=VIEWS[cur]()+updaterNotice()+reconciliationNotice();const em={'Recent games':'🏒','Roster':'🧑‍🚀','Club profile':'🛡️','Match trends':'📈',"Coach's insights":'📋','Box scores: in progress':'🛠️','Box score cross-check':'🔎','Night vs Club':'📊','Goalie rating review':'🥅','Skater rating review':'⭐','Points by game':'🚀','Giveaways by game':'🏒','Save percentage by game':'🧱','Shots faced by game':'🥅'};$('#view').querySelectorAll('h2').forEach(h=>{const icon=em[h.textContent];if(icon)h.textContent=icon+' '+h.textContent});const tw=document.createTreeWalker($('#view'),NodeFilter.SHOW_TEXT);while(tw.nextNode())tw.currentNode.nodeValue=nickText(tw.currentNode.nodeValue); if(keepScroll) window.scrollTo(0,y);
  try{localStorage.setItem('amc-view',cur)}catch(e){}
}
document.addEventListener('click',e=>{
 const dw=e.target.closest('[data-detail-window]');if(dw){detailWindow=dw.dataset.detailWindow==='night'?'night':'all';render(true);return}
 const dc=e.target.closest('[data-detail-competition]');if(dc){detailCompetition=['regular','playoffs'].includes(dc.dataset.detailCompetition)?dc.dataset.detailCompetition:'all';render(true);return}
 const sec=e.target.closest('[data-player-section]');if(sec){playerSection=['trends','stats','games','shots'].includes(sec.dataset.playerSection)?sec.dataset.playerSection:'summary';render(true);return}
 const ps=e.target.closest('[data-player-scope]');if(ps){playerScope=ps.dataset.playerScope==='career'?'career':'astroneers';render(true);return}
 const lc=e.target.closest('[data-league-scope]');if(lc){leagueScope=lc.dataset.leagueScope==='history'?'history':'night';render(true);return}
 if(e.target.closest('[data-copy-report]')){if(persistedReports[0])navigator.clipboard.writeText(persistedReports[0].summary).then(()=>toast('Team summary copied.')).catch(()=>toast('Copy unavailable. Open the report to select its text.'));return}

 const menu=e.target.closest('[data-menu-link]');if(menu)document.getElementById('missionMenu').open=false;
 const gc=e.target.closest('[data-game-competition]');if(gc){gameCompetition=gc.dataset.gameCompetition;render(true);return}
 const gs=e.target.closest('[data-game-scope]');if(gs){gameScope=gs.dataset.gameScope;render(true);return}
 const go=e.target.closest('[data-game-outcome]');if(go){gameOutcome=go.dataset.gameOutcome;render(true);return}

  const fl=e.target.closest('[data-flip]'); if(fl){e.preventDefault();tileMode[fl.dataset.flip]=fl.dataset.mode;render(true);return}
  const t=e.target.closest('[data-player]'); if(t){selP=t.dataset.player; if(t.classList.contains('tile')){location.hash='players';return}}
  const mr=e.target.closest('[data-match]'); if(mr){openMatch=mr.dataset.match;location.hash='matches';return}
  const pk=e.target.closest('[data-pick]'); if(pk){selP=pk.dataset.pick;render(true);return}
  const pg=e.target.closest('[data-pg]'); if(pg){perGameP=pg.dataset.pg==='1';render(true);return}
  const statsToggle=e.target.closest('[data-stat-scope]'); if(statsToggle){statsScope=statsToggle.dataset.statScope;render(true);return}
  const cmpSection=e.target.closest('[data-compare-section]');if(cmpSection){compareSection=cmpSection.dataset.compareSection;render(true);return}
  const cmpScope=e.target.closest('[data-compare-scope]');if(cmpScope){compareScope=cmpScope.dataset.compareScope;render(true);return}
  const cmpRate=e.target.closest('[data-compare-rate]');if(cmpRate){comparePerGame=cmpRate.dataset.compareRate==='1';render(true);return}
  const pgt=e.target.closest('[data-pgt]'); if(pgt){perGameT=pgt.dataset.pgt==='1';render(true);return}
  const tb=e.target.closest('[data-tab]'); if(tb){tab=tb.dataset.tab;render(true);return}
  const th=e.target.closest('th[data-sort]'); if(th){sortK=th.dataset.sort;render(true);return}
  const zv=e.target.closest('[data-zone-view]'); if(zv){zoneView[zv.dataset.zoneView]=zv.dataset.mode;render(true);return}
  const z=e.target.closest('[data-zone]'); if(z){zoneMode[z.dataset.zone]=z.dataset.mode;render(true);return}
  const ins=e.target.closest('[data-ins]'); if(ins){const id=ins.dataset.ins;openIns.has(id)?openIns.delete(id):openIns.add(id);render(true);return}
  const o=e.target.closest('[data-open]'); if(o){openMatch=openMatch===o.dataset.open?null:o.dataset.open;render(true);return}
});
document.addEventListener('keydown',e=>{const tl=e.target.classList&&e.target.classList.contains('tile')&&e.target;if(tl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selP=tl.dataset.player;location.hash='players';return}const th=e.target.closest&&e.target.closest('th[data-sort]');if(th&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sortK=th.dataset.sort;render(true)}});
document.addEventListener('change',e=>{if(e.target.id==='cmpA'){cmpA=e.target.value;render(true)}if(e.target.id==='cmpB'){cmpB=e.target.value;render(true)}if(e.target.id==='cmpC'){cmpC=e.target.value||null;render(true)}});
document.addEventListener('input',e=>{if(e.target.id==='rawq'){rawQ=e.target.value;render(true);const i=$('#rawq');if(i){i.focus();i.setSelectionRange(rawQ.length,rawQ.length)}}});
window.addEventListener('hashchange',()=>{render();if(cur==='matches'&&openMatch){const el=document.querySelector(`[data-open="${CSS.escape(openMatch)}"]`);if(el){el.closest('.card').scrollIntoView({block:'start'});return}}window.scrollTo(0,0)});

const stampOf=(d,m)=>(d&&d.fetchedAt||'')+'|'+(m&&(m.updatedAt||'')||'')+'|'+(m&&m.matches?m.matches.length:0)+'|'+(d?.connection?.lastAttempt||'')+'|'+(persistedReports[0]?.createdAt||'');
let loadedStamp=null, checking=false;
function fetchData(){const q='?t='+Date.now();return Promise.all([
  fetch('data.json'+q,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('stats file HTTP '+r.status);return r.json()}),
  fetch('matches.json'+q,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('api/reports',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Report API unavailable');return r.json()}).catch(()=>fetch('reports.json'+q,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)).then(r=>{persistedReports=Array.isArray(r?.reports)?r.reports:[];return r})])}
function apply(d,m){
  D=d;M=m&&Array.isArray(m.matches)?m:null;P=d.members.map(derive);P.forEach(coachRate);
  [...P].sort((a,b)=>a.name.localeCompare(b.name)).forEach((p,i)=>{COL[p.name]=COLORS[i%4]});
  const t=new Date(d.fetchedAt);
  $('#stamp').textContent='Updated '+t.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  $('#dot').classList.toggle('off',(Date.now()-t)>36*3600e3);
  $('#sub').textContent=`NHL 27 · EASHL 3v3 · Division ${d.clubStats.currentDivision} · Club 69789`;
  loadedStamp=stampOf(d,m);
}
let toastT=null;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},5000)}
async function checkForUpdates(manual){
  if(checking)return;checking=true;const b=$('#refreshBtn');b.classList.add('spin');b.disabled=true;
  try{const [d,m]=await fetchData();
    if(stampOf(d,m)!==loadedStamp){const before=M?M.matches.length:0;apply(d,m);render(true);const added=(M?M.matches.length:0)-before;
      toast('New stats loaded'+(added>0?`: ${added} new game${added>1?'s':''}`:'')+'.');}
    else if(manual) toast('No newer published stats are available.');
  }catch(e){if(manual)toast("Couldn't check for new stats. Try again in a minute.")}
  finally{checking=false;b.classList.remove('spin');b.disabled=false}
}
document.getElementById('refreshBtn').innerHTML=I('refresh',18);
document.getElementById('refreshBtn').addEventListener('click',()=>checkForUpdates(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&D)checkForUpdates(false)});
setInterval(()=>{if(document.visibilityState==='visible'&&D)checkForUpdates(false)},15*60e3);
fetchData().then(([d,m])=>{
  apply(d,m);
  if(!location.hash){let s=null;try{s=localStorage.getItem('amc-view')}catch(e){} if(s&&VIEWS[s]&&s!=='overview'){location.hash=s;return}}
  render();
}).catch(err=>{
  $('#stamp').textContent='Offline';
  $('#view').innerHTML=`<div class="card s4 err"><div class="h"><h2>Stats did not load</h2></div><div class="empty">The stats file could not be read (${esc(err.message)}). Reload the page to try again.</div></div>`;
});
})();
</script>
